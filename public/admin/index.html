<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>NextGenTechBD — অ্যাডমিন প্যানেল</title>
<style>
:root{--orange:#F85606;--orange-dark:#e04a04;--bg:#f4f4f4;--card:#fff;--text:#222;--muted:#8a8a8a;--border:#ececec;--radius:10px;--shadow:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;padding:9px 10px;border:1px solid #ddd;border-radius:8px;width:100%;background:#fff}
label{font-size:12.5px;color:#555;font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.btn{background:var(--orange);color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13.5px}
.btn:hover{background:var(--orange-dark)}
.btn.gray{background:#eee;color:#333}
.btn.gray:hover{background:#ddd}
.btn.red{background:#d92646;color:#fff}
.btn.small{padding:6px 10px;font-size:12.5px}
.container{max-width:1100px;margin:0 auto;padding:16px}
.hidden{display:none !important}

/* ---- Login ---- */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:32px 28px;max-width:360px;width:100%}
.login-card h1{font-size:20px;margin-bottom:6px;color:var(--orange-dark)}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:18px}
.login-err{color:#d92646;font-size:13px;margin-top:8px;display:none}

/* ---- Shell ---- */
header.topbar{background:#fff;box-shadow:0 1px 0 var(--border);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;color:var(--orange-dark);font-size:16px}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:13px;color:#555}
.tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:14px;color:var(--orange-dark)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:11.5px;text-transform:uppercase}
.row-actions{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.ok{background:#e8f8ef;color:#0a7a3d}
.msg.error{background:#fdeaea;color:#c22}
.emoji-input{width:64px !important;text-align:center}
.divider{border-top:1px solid var(--border);margin:14px 0}
.spinner{text-align:center;padding:30px;color:var(--muted)}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginWrap">
  <div class="login-card">
    <h1>🛍️ NextGenTechBD</h1>
    <p>অ্যাডমিন প্যানেলে ঢুকতে আপনার অ্যাডমিন কী দিন</p>
    <div class="field">
      <label>অ্যাডমিন কী (Admin Key)</label>
      <input type="password" id="adminKeyInput" placeholder="আপনার সিক্রেট কী" />
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">লগইন করুন</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">🛍️ NextGenTechBD — অ্যাডমিন</div>
      <button class="btn gray small" onclick="doLogout()">লগআউট</button>
    </div>
  </header>
  <div class="container">
    <div class="tabs">
      <div class="tab" data-tab="products" onclick="switchTab('products')">🛍️ পণ্যসমূহ</div>
      <div class="tab" data-tab="categories" onclick="switchTab('categories')">🗂️ ক্যাটাগরি</div>
      <div class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ দোকানের সেটিংস</div>
      <div class="tab" data-tab="orders" onclick="switchTab('orders')">📦 অর্ডারসমূহ</div>
    </div>
    <div id="msgBox"></div>
    <div id="tabContent"></div>
  </div>
</div>

<script>
const API = '/api';
let ADMIN_KEY = localStorage.getItem('ngtbd_admin_key') || '';
let CATS_CACHE = [];

/* ============ AUTH ============ */
async function doLogin(){
  const key = document.getElementById('adminKeyInput').value.trim();
  const errBox = document.getElementById('loginErr');
  errBox.style.display='none';
  if(!key){ errBox.textContent='অ্যাডমিন কী দিন'; errBox.style.display='block'; return; }
  try{
    const r = await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'লগইন ব্যর্থ');
    ADMIN_KEY = key;
    localStorage.setItem('ngtbd_admin_key', key);
    showApp();
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display='block';
  }
}
function doLogout(){
  localStorage.removeItem('ngtbd_admin_key');
  ADMIN_KEY='';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginWrap').classList.remove('hidden');
}
function showApp(){
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  switchTab('products');
}

/* ============ API HELPERS ============ */
async function adminApi(path, method='GET', body){
  const r = await fetch(API+path,{
    method,
    headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(()=>({}));
  if(r.status===401){ doLogout(); throw new Error('সেশন শেষ — আবার লগইন করুন'); }
  if(!r.ok) throw new Error(j.error || 'একটি সমস্যা হয়েছে');
  return j;
}
function showMsg(text, type){
  const box = document.getElementById('msgBox');
  box.innerHTML = '<div class="msg '+type+'">'+text+'</div>';
  setTimeout(()=>{ box.innerHTML=''; }, 4000);
}

/* ============ TABS ============ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  const c = document.getElementById('tabContent');
  c.innerHTML = '<div class="spinner">লোড হচ্ছে…</div>';
  if(name==='products') renderProducts();
  else if(name==='categories') renderCategories();
  else if(name==='settings') renderSettings();
  else if(name==='orders') renderOrders();
}

/* ============ PRODUCTS ============ */
async function renderProducts(){
  const c = document.getElementById('tabContent');
  try{
    const [{products}, {categories}] = await Promise.all([adminApi('/admin/products'), adminApi('/admin/categories')]);
    CATS_CACHE = categories;
    const catName = id => { const x=categories.find(x=>x.id===id); return x ? (x.e+' '+x.name) : id; };
    c.innerHTML = `
      <div class="card">
        <h2>➕ নতুন পণ্য যোগ করুন / সম্পাদনা</h2>
        <form id="prodForm" onsubmit="saveProduct(event)">
          <input type="hidden" id="p_id" />
          <div class="grid3">
            <div class="field"><label>নাম (বাংলা) *</label><input id="p_name" required /></div>
            <div class="field"><label>Name (English)</label><input id="p_name_en" /></div>
            <div class="field"><label>ক্যাটাগরি *</label>
              <select id="p_cat" required>${categories.map(x=>`<option value="${x.id}">${x.e||''} ${x.name}</option>`).join('')}</select>
            </div>
          </div>
          <div class="grid3">
            <div class="field"><label>বিক্রয় মূল্য (৳) *</label><input id="p_price" type="number" required /></div>
            <div class="field"><label>আগের মূল্য (৳)</label><input id="p_old" type="number" /></div>
            <div class="field"><label>ইমোজি আইকন</label><input id="p_e" class="emoji-input" placeholder="📱" /></div>
          </div>
          <div class="grid3">
            <div class="field"><label>রেটিং (০-৫)</label><input id="p_r" type="number" step="0.1" /></div>
            <div class="field"><label>রিভিউ সংখ্যা</label><input id="p_rv" type="number" /></div>
            <div class="field"><label>বিক্রি হয়েছে</label><input id="p_sold" type="number" /></div>
          </div>
          <div class="grid3">
            <div class="field"><label>ট্যাগ (হট/নতুন/ফ্রি ডেলিভারি)</label><input id="p_tag" /></div>
            <div class="field"><label>রং (কমা দিয়ে আলাদা)</label><input id="p_colors" placeholder="কালো, সাদা" /></div>
            <div class="field"><label>সাইজ (কমা দিয়ে আলাদা)</label><input id="p_sizes" placeholder="S, M, L, XL" /></div>
          </div>
          <div class="field" style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="p_f" style="width:auto" /> <label style="margin:0">ফ্ল্যাশ সেলে দেখাবে?</label>
          </div>
          <div class="row-actions">
            <button type="submit" class="btn">💾 সংরক্ষণ করুন</button>
            <button type="button" class="btn gray" onclick="resetProductForm()">✖ ফর্ম খালি করুন</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>🛍️ সব পণ্য (${products.length})</h2>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>নাম</th><th>ক্যাটাগরি</th><th>মূল্য</th><th>ফ্ল্যাশ</th><th></th></tr></thead>
          <tbody>
            ${products.map(p=>`
              <tr>
                <td>${p.e||''} ${p.name}</td>
                <td>${catName(p.cat)}</td>
                <td>৳${p.price}${p.old?` <s style="color:#aaa">৳${p.old}</s>`:''}</td>
                <td>${p.f?'✅':'—'}</td>
                <td class="row-actions">
                  <button class="btn gray small" onclick='editProduct(${JSON.stringify(p)})'>✏️ এডিট</button>
                  <button class="btn red small" onclick="deleteProduct(${p.id})">🗑️ মুছুন</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>`;
  }catch(e){ c.innerHTML = `<div class="msg error">${e.message}</div>`; }
}
function resetProductForm(){
  ['p_id','p_name','p_name_en','p_price','p_old','p_e','p_r','p_rv','p_sold','p_tag','p_colors','p_sizes'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  document.getElementById('p_f').checked=false;
}
function editProduct(p){
  document.getElementById('p_id').value=p.id;
  document.getElementById('p_name').value=p.name||'';
  document.getElementById('p_name_en').value=p.name_en||'';
  document.getElementById('p_cat').value=p.cat||'';
  document.getElementById('p_price').value=p.price||'';
  document.getElementById('p_old').value=p.old||'';
  document.getElementById('p_e').value=p.e||'';
  document.getElementById('p_r').value=p.r||'';
  document.getElementById('p_rv').value=p.rv||'';
  document.getElementById('p_sold').value=p.sold||'';
  document.getElementById('p_tag').value=p.tag||'';
  document.getElementById('p_colors').value=(p.colors||[]).join(', ');
  document.getElementById('p_sizes').value=(p.sizes||[]).join(', ');
  document.getElementById('p_f').checked=!!p.f;
  window.scrollTo({top:0,behavior:'smooth'});
}
async function saveProduct(ev){
  ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const splitList = s => s.split(',').map(x=>x.trim()).filter(Boolean);
  const body = {
    id: val('p_id') || undefined,
    name: val('p_name'), name_en: val('p_name_en'), cat: val('p_cat'),
    price: Number(val('p_price')), old: val('p_old')?Number(val('p_old')):undefined,
    e: val('p_e'), r: val('p_r')?Number(val('p_r')):undefined, rv: val('p_rv')?Number(val('p_rv')):undefined,
    sold: val('p_sold')?Number(val('p_sold')):undefined, tag: val('p_tag'),
    colors: splitList(val('p_colors')), sizes: splitList(val('p_sizes')),
    f: document.getElementById('p_f').checked
  };
  try{
    await adminApi('/admin/products','POST',body);
    showMsg('✅ পণ্য সংরক্ষণ হয়েছে','ok');
    resetProductForm();
    renderProducts();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}
async function deleteProduct(id){
  if(!confirm('আপনি কি নিশ্চিত এই পণ্যটি মুছে ফেলতে চান?')) return;
  try{
    await adminApi('/admin/products?id='+id,'DELETE');
    showMsg('🗑️ পণ্য মুছে ফেলা হয়েছে','ok');
    renderProducts();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ============ CATEGORIES ============ */
async function renderCategories(){
  const c = document.getElementById('tabContent');
  try{
    const {categories} = await adminApi('/admin/categories');
    c.innerHTML = `
      <div class="card">
        <h2>➕ নতুন ক্যাটাগরি যোগ / সম্পাদনা</h2>
        <form onsubmit="saveCategory(event)">
          <div class="grid3">
            <div class="field"><label>আইডি (ছোট হাতের ইংরেজি) *</label><input id="c_id" required /></div>
            <div class="field"><label>নাম (বাংলা) *</label><input id="c_name" required /></div>
            <div class="field"><label>Name (English)</label><input id="c_name_en" /></div>
          </div>
          <div class="grid3">
            <div class="field"><label>ইমোজি আইকন</label><input id="c_e" class="emoji-input" placeholder="📱" /></div>
            <div class="field"><label>ক্রম (Sort Order)</label><input id="c_sort" type="number" value="0" /></div>
          </div>
          <div class="row-actions">
            <button type="submit" class="btn">💾 সংরক্ষণ করুন</button>
            <button type="button" class="btn gray" onclick="resetCatForm()">✖ ফর্ম খালি করুন</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>🗂️ সব ক্যাটাগরি (${categories.length})</h2>
        <table>
          <thead><tr><th>আইডি</th><th>নাম</th><th></th></tr></thead>
          <tbody>
            ${categories.map(x=>`
              <tr>
                <td>${x.id}</td>
                <td>${x.e||''} ${x.name}</td>
                <td class="row-actions">
                  <button class="btn gray small" onclick='editCategory(${JSON.stringify(x)})'>✏️ এডিট</button>
                  <button class="btn red small" onclick="deleteCategory('${x.id}')">🗑️ মুছুন</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }catch(e){ c.innerHTML = `<div class="msg error">${e.message}</div>`; }
}
function resetCatForm(){
  ['c_id','c_name','c_name_en','c_e'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('c_sort').value='0';
}
function editCategory(x){
  document.getElementById('c_id').value=x.id;
  document.getElementById('c_name').value=x.name||'';
  document.getElementById('c_name_en').value=x.name_en||'';
  document.getElementById('c_e').value=x.e||'';
  document.getElementById('c_sort').value=x.sort_order||0;
  window.scrollTo({top:0,behavior:'smooth'});
}
async function saveCategory(ev){
  ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const body = { id: val('c_id'), name: val('c_name'), name_en: val('c_name_en'), e: val('c_e'), sort_order: Number(val('c_sort'))||0 };
  try{
    await adminApi('/admin/categories','POST',body);
    showMsg('✅ ক্যাটাগরি সংরক্ষণ হয়েছে','ok');
    resetCatForm();
    renderCategories();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}
async function deleteCategory(id){
  if(!confirm('আপনি কি নিশ্চিত এই ক্যাটাগরিটি মুছে ফেলতে চান?')) return;
  try{
    await adminApi('/admin/categories?id='+encodeURIComponent(id),'DELETE');
    showMsg('🗑️ ক্যাটাগরি মুছে ফেলা হয়েছে','ok');
    renderCategories();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ============ SETTINGS ============ */
async function renderSettings(){
  const c = document.getElementById('tabContent');
  try{
    const s = await adminApi('/admin/settings');
    c.innerHTML = `
      <div class="card">
        <h2>📞 যোগাযোগ</h2>
        <div class="grid2">
          <div class="field"><label>মোবাইল নম্বর</label><input id="s_phone" value="${s.phone||''}" /></div>
          <div class="field"><label>হোয়াটসঅ্যাপ নম্বর (দেশের কোডসহ, + ছাড়া)</label><input id="s_whatsapp" value="${s.whatsapp||''}" /></div>
          <div class="field"><label>টেলিগ্রাম নম্বর</label><input id="s_telegram" value="${s.telegram||''}" /></div>
          <div class="field"><label>ফেসবুক পেজ লিংক</label><input id="s_facebook" value="${s.facebook||''}" /></div>
          <div class="field"><label>জিমেইল</label><input id="s_email" value="${s.email||''}" /></div>
        </div>
        <div class="divider"></div>
        <h2>💳 পেমেন্ট</h2>
        <div class="grid2">
          <div class="field"><label>বিকাশ নম্বর</label><input id="s_bkash" value="${s.bkash||''}" /></div>
          <div class="field"><label>নগদ নম্বর</label><input id="s_nagad" value="${s.nagad||''}" /></div>
          <div class="field"><label>রকেট নম্বর</label><input id="s_rocket" value="${s.rocket||''}" /></div>
          <div class="field" style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="s_cod" style="width:auto" ${s.cod?'checked':''} /> <label style="margin:0">ক্যাশ অন ডেলিভারি চালু?</label>
          </div>
        </div>
        <button class="btn" onclick="saveSettings()">💾 সংরক্ষণ করুন</button>
      </div>`;
  }catch(e){ c.innerHTML = `<div class="msg error">${e.message}</div>`; }
}
async function saveSettings(){
  const val = id => document.getElementById(id).value.trim();
  const body = {
    contact:{phone:val('s_phone'),whatsapp:val('s_whatsapp'),telegram:val('s_telegram'),facebook:val('s_facebook'),email:val('s_email')},
    payment:{bkash:val('s_bkash'),nagad:val('s_nagad'),rocket:val('s_rocket'),cod:document.getElementById('s_cod').checked}
  };
  try{
    await adminApi('/admin/settings','PUT',body);
    showMsg('✅ সেটিংস সংরক্ষণ হয়েছে','ok');
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ============ ORDERS ============ */
const STATUS_L={pending:'🕐 অপেক্ষমান',confirmed:'✔ নিশ্চিত',shipped:'🚚 পাঠানো হয়েছে',delivered:'✅ ডেলিভার্ড',cancelled:'✖ বাতিল'};
async function renderOrders(){
  const c = document.getElementById('tabContent');
  try{
    const {orders} = await adminApi('/admin/orders');
    c.innerHTML = `
      <div class="card">
        <h2>📦 অর্ডারসমূহ (${orders.length})</h2>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>অর্ডার নং</th><th>কাস্টমার</th><th>মোট</th><th>পেমেন্ট</th><th>স্ট্যাটাস</th><th>তারিখ</th></tr></thead>
          <tbody>
            ${orders.map(o=>`
              <tr>
                <td>${o.order_no}</td>
                <td>${o.name}<br><small style="color:#888">${o.phone}</small></td>
                <td>৳${o.total}</td>
                <td>${o.payment||'-'}</td>
                <td>
                  <select onchange="updateOrderStatus(${o.id}, this.value)">
                    ${Object.keys(STATUS_L).map(k=>`<option value="${k}" ${o.status===k?'selected':''}>${STATUS_L[k]}</option>`).join('')}
                  </select>
                </td>
                <td><small>${(o.created_at||'').slice(0,16)}</small></td>
              </tr>`).join('')}
          </tbody>
        </table>
        </div>
        ${orders.length===0?'<p style="color:#888;margin-top:10px">এখনো কোনো অর্ডার আসেনি</p>':''}
      </div>`;
  }catch(e){ c.innerHTML = `<div class="msg error">${e.message}</div>`; }
}
async function updateOrderStatus(id, status){
  try{
    await adminApi('/admin/orders','PATCH',{id,status});
    showMsg('✅ অর্ডারের স্ট্যাটাস আপডেট হয়েছে','ok');
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ============ BOOT ============ */
if(ADMIN_KEY){ showApp(); }
</script>
</body>
</html>
