<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>NextGenTechBD — অ্যাডমিন প্যানেল</title>
<link rel="icon" href="/assets/logo-icon.png" />
<style>
:root{--orange:#F85606;--orange-dark:#e04a04;--bg:#f4f4f4;--card:#fff;--text:#222;--muted:#8a8a8a;--border:#ececec;--radius:10px;--shadow:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;padding:9px 10px;border:1px solid #ddd;border-radius:8px;width:100%;background:#fff}
label{font-size:12.5px;color:#555;font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.btn{background:var(--orange);color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13.5px}
.btn:hover{background:var(--orange-dark)}
.btn.gray{background:#eee;color:#333}
.btn.gray:hover{background:#ddd}
.btn.red{background:#d92646;color:#fff}
.btn.small{padding:6px 10px;font-size:12.5px}
.container{max-width:1100px;margin:0 auto;padding:16px}
.hidden{display:none !important}

/* ---- Login ---- */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:32px 28px;max-width:360px;width:100%}
.login-card h1{font-size:20px;margin-bottom:6px;color:var(--orange-dark)}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:18px}
.login-err{color:#d92646;font-size:13px;margin-top:8px;display:none}

/* ---- Shell ---- */
header.topbar{background:#fff;box-shadow:0 1px 0 var(--border);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;color:var(--orange-dark);font-size:16px}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:13px;color:#555}
.tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:14px;color:var(--orange-dark)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:11.5px;text-transform:uppercase}
.row-actions{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.ok{background:#e8f8ef;color:#0a7a3d}
.msg.error{background:#fdeaea;color:#c22}
.emoji-input{width:64px !important;text-align:center}
.divider{border-top:1px solid var(--border);margin:14px 0}
.spinner{text-align:center;padding:30px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat-card .n{font-size:24px;font-weight:800;color:var(--orange-dark)}
.stat-card .l{font-size:12px;color:var(--muted);margin-top:2px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.bar-row .lbl{width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-wrap{flex:1;background:#f0f0f0;border-radius:6px;height:16px;overflow:hidden}
.bar-row .bar-fill{background:var(--orange);height:100%;border-radius:6px}
.bar-row .val{width:50px;text-align:right;flex-shrink:0;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:#e8f8ef;color:#0a7a3d}
.badge.warn{background:#fff3d6;color:#a06b00}
.badge.danger{background:#fdeaea;color:#c22}
.note-box{background:#fff8e6;border:1px solid #ffe4a3;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7a5900;margin-bottom:14px}
.notify-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#d92646;color:#fff;font-size:11px;font-weight:800;margin-left:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.toast-order{position:fixed;top:16px;right:16px;background:#fff;border-left:4px solid var(--orange);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:10px;padding:14px 16px;max-width:320px;z-index:999;cursor:pointer;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-order b{color:var(--orange-dark)}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginWrap">
  <div class="login-card">
    <h1><img src="/assets/logo-icon.png" alt="" style="height:38px;vertical-align:middle;margin-right:6px"><img src="/assets/logo.png" alt="NextGenTechBD" style="height:28px;vertical-align:middle"></h1>
    <p>অ্যাডমিন প্যানেলে ঢুকতে আপনার অ্যাডমিন কী দিন</p>
    <div class="field">
      <label>অ্যাডমিন কী (Admin Key)</label>
      <input type="password" id="adminKeyInput" placeholder="আপনার সিক্রেট কী" />
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">লগইন করুন</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="/assets/logo-icon.png" alt="" style="height:24px;vertical-align:middle;margin-right:4px"><img src="/assets/logo.png" alt="NextGenTechBD" style="height:18px;vertical-align:middle;margin-right:6px">অ্যাডমিন</div>
      <button class="btn gray small" onclick="doLogout()">লগআউট</button>
    </div>
  </header>
  <div class="container">
    <div class="tabs">
      <div class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">📊 ড্যাশবোর্ড</div>
      <div class="tab" data-tab="orders" onclick="switchTab('orders')">📦 অর্ডারসমূহ<span id="orderNotifyBadge" class="notify-badge hidden">0</span></div>
      <div class="tab" data-tab="sellers" onclick="switchTab('sellers')">🏪 সেলার</div>
      <div class="tab" data-tab="subscriptions" onclick="switchTab('subscriptions')">💳 সাবস্ক্রিপশন</div>
      <div class="tab" data-tab="customers" onclick="switchTab('customers')">👥 কাস্টমার</div>
      <div class="tab" data-tab="products" onclick="switchTab('products')">🛍️ পণ্যসমূহ</div>
      <div class="tab" data-tab="categories" onclick="switchTab('categories')">🗂️ ক্যাটাগরি</div>
      <div class="tab" data-tab="coupons" onclick="switchTab('coupons')">🎟️ কুপন ও অফার</div>
      <div class="tab" data-tab="banners" onclick="switchTab('banners')">🖼️ ব্যানার/স্লাইডার</div>
      <div class="tab" data-tab="reviews" onclick="switchTab('reviews')">⭐ রিভিউ</div>
      <div class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ দোকানের সেটিংস</div>
      <div class="tab" data-tab="hometext" onclick="switchTab('hometext')">📝 হোমপেজ টেক্সট</div>
      <div class="tab" data-tab="security" onclick="switchTab('security')">🔐 সিকিউরিটি</div>
      <div class="tab" data-tab="backup" onclick="switchTab('backup')">💾 ব্যাকআপ</div>
    </div>
    <div id="msgBox"></div>
    <div id="tabContent"></div>
  </div>
</div>

<script>
const API = '/api';
let ADMIN_KEY = localStorage.getItem('ngtbd_admin_key') || '';
let ADMIN_SESSION = localStorage.getItem('ngtbd_admin_session') === '1'; // HttpOnly cookie সেশন (কী আর ব্রাউজারে জমা থাকে না)
let CATS_CACHE = [];

/* ============ AUTH ============ */
async function doLogin(){
  const key = document.getElementById('adminKeyInput').value.trim();
  const errBox = document.getElementById('loginErr');
  errBox.style.display='none';
  if(!key){ errBox.textContent='অ্যাডমিন কী দিন'; errBox.style.display='block'; return; }
  try{
    const r = await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'লগইন ব্যর্থ');
    if(j.session){ ADMIN_SESSION = true; ADMIN_KEY = ''; localStorage.setItem('ngtbd_admin_session','1'); localStorage.removeItem('ngtbd_admin_key'); }
    else { ADMIN_KEY = key; localStorage.setItem('ngtbd_admin_key', key); } // ০০৭ মাইগ্রেশন না চললে আগের পদ্ধতি
    showApp();
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display='block';
  }
}
function doLogout(){
  if(ADMIN_SESSION){ try{ fetch(API+'/admin/logout',{method:'POST'}); }catch(e){} }
  localStorage.removeItem('ngtbd_admin_key'); localStorage.removeItem('ngtbd_admin_session');
  ADMIN_KEY=''; ADMIN_SESSION=false;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginWrap').classList.remove('hidden');
  stopOrderNotifications();
}
function showApp(){
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  switchTab('dashboard');
  startOrderNotifications();
}

/* ============ API HELPERS ============ */
async function adminApi(path, method='GET', body){
  const r = await fetch(API+path,{
    method,
    headers:Object.assign({'Content-Type':'application/json'}, ADMIN_KEY?{'X-Admin-Key':ADMIN_KEY}:{}),
    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(()=>({}));
  if(r.status===401){ doLogout(); throw new Error('সেশন শেষ — আবার লগইন করুন'); }
  if(!r.ok) throw new Error(j.error || 'একটি সমস্যা হয়েছে');
  return j;
}
function showMsg(text, type){
  const box = document.getElementById('msgBox');
  box.innerHTML = '<div class="msg '+type+'">'+text+'</div>';
  setTimeout(()=>{ box.innerHTML=''; }, 4000);
}

/* ============ নতুন অর্ডার নোটিফিকেশন ============ */
const ORIGINAL_TITLE = document.title;
let NOTIFY_POLL_TIMER = null;
let LAST_SEEN_IDS = new Set();
let NOTIFY_FIRST_RUN = true;

function startOrderNotifications(){
  if(typeof Notification!=='undefined' && Notification.permission==='default'){
    // অ্যাডমিন প্রথমবার লগইন করলে ব্রাউজার নোটিফিকেশনের অনুমতি চাওয়া হয় (নিরবে ব্যর্থ হলেও সমস্যা নেই)
    Notification.requestPermission().catch(()=>{});
  }
  pollNewOrders();
  NOTIFY_POLL_TIMER = setInterval(pollNewOrders, 20000); // প্রতি ২০ সেকেন্ডে চেক করবে
}
function stopOrderNotifications(){
  if(NOTIFY_POLL_TIMER){ clearInterval(NOTIFY_POLL_TIMER); NOTIFY_POLL_TIMER=null; }
  document.title = ORIGINAL_TITLE;
}
async function pollNewOrders(){
  if(!ADMIN_KEY && !ADMIN_SESSION) return;
  try{
    const j = await adminApi('/admin/orders/unseen');
    const badge = document.getElementById('orderNotifyBadge');
    if(j.count>0){
      badge.textContent = j.count>99?'99+':j.count;
      badge.classList.remove('hidden');
      document.title = '('+j.count+') '+ORIGINAL_TITLE;
    }else{
      badge.classList.add('hidden');
      document.title = ORIGINAL_TITLE;
    }
    // নতুন অর্ডার শনাক্ত হলে সাউন্ড + টোস্ট + ব্রাউজার নোটিফিকেশন (প্রথমবার পোল করার সময় দেখানো হয় না, যাতে লগইন করা মাত্রই পুরনো নোটিফিকেশনে সাউন্ড না বাজে)
    const freshOnes = (j.orders||[]).filter(o=>!LAST_SEEN_IDS.has(o.id));
    if(!NOTIFY_FIRST_RUN && freshOnes.length){
      playNotifySound();
      freshOnes.slice(0,3).forEach(o=>showOrderToast(o));
      if(typeof Notification!=='undefined' && Notification.permission==='granted'){
        try{ new Notification('🛍️ নতুন অর্ডার এসেছে!', {body: freshOnes[0].name+' — ৳'+freshOnes[0].total+' ('+freshOnes[0].order_no+')'}); }catch(e){}
      }
    }
    (j.orders||[]).forEach(o=>LAST_SEEN_IDS.add(o.id));
    NOTIFY_FIRST_RUN = false;
  }catch(e){ /* পোলিং ব্যর্থ হলেও প্যানেল ব্যবহারে বাধা দেওয়া ঠিক না */ }
}
async function markOrdersSeen(){
  try{
    await adminApi('/admin/orders/unseen','POST',{});
    document.getElementById('orderNotifyBadge').classList.add('hidden');
    document.title = ORIGINAL_TITLE;
  }catch(e){}
}
function showOrderToast(o){
  const el = document.createElement('div');
  el.className = 'toast-order';
  el.innerHTML = '🛍️ <b>নতুন অর্ডার!</b><br>'+o.name+' — ৳'+o.total+'<br><small style="color:#888">'+o.order_no+'</small>';
  el.onclick = ()=>{ switchTab('orders'); el.remove(); };
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 8000);
}
function playNotifySound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880,1108].forEach((freq,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      o.connect(g); g.connect(ctx.destination);
      const start = ctx.currentTime + i*0.15;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start+0.28);
      o.start(start); o.stop(start+0.3);
    });
  }catch(e){}
}

/* ============ হেল্পার (সেলারের দেওয়া সব ডেটা অবশ্যই esc() করে দেখানো হয় — সেলার অবিশ্বস্ত ইনপুট) ============ */
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const byId = id => document.getElementById(id);
const taka = n => '৳'+Number(n||0).toLocaleString('en-US');
const dt = s => s ? esc(String(s).replace('T',' ').slice(0,16)) : '—';
const SUB_LABEL = {trial:['ফ্রি ট্রায়াল','warn'],active:['সক্রিয় সাবস্ক্রিপশন','ok'],grace:['গ্রেস পিরিয়ড','warn'],expired:['মেয়াদ শেষ','danger'],exempt:['প্রযোজ্য নয়','ok'],override_allow:['ওভাররাইড: চালু','ok'],override_deny:['ওভাররাইড: বন্ধ','danger']};
const ST_BADGE = {active:['সক্রিয়','ok'],suspended:['সাসপেন্ডেড','warn'],blocked:['ব্লকড','danger']};
const OI_STATUS = {pending:'অপেক্ষমান',processing:'প্রসেসিং',confirmed:'নিশ্চিত',shipped:'পাঠানো হয়েছে',delivered:'ডেলিভার্ড',cancelled:'বাতিল',returned:'ফেরত'};
function subBadge(s){ const [l,c]=SUB_LABEL[s.state]||[s.state,'warn']; return '<span class="badge '+c+'">'+esc(l)+'</span>'+(s.days_left!=null&&['trial','active','grace'].includes(s.state)?' <small>'+s.days_left+' দিন বাকি</small>':''); }
function stBadge(st){ const [l,c]=ST_BADGE[st]||[st,'warn']; return '<span class="badge '+c+'">'+esc(l)+'</span>'; }
function showSecret(title, username, password){
  const o = document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML = '<div class="card" style="max-width:420px;width:100%;margin:0"><h2>'+esc(title)+'</h2>'+
    (username?'<p style="margin-bottom:6px">ইউজারনেম: <b>'+esc(username)+'</b></p>':'')+
    '<p style="margin-bottom:6px">পাসওয়ার্ড (শুধু এখনই দেখানো হচ্ছে):</p>'+
    '<div style="font-family:monospace;font-size:18px;background:#f7f7f7;border:1px dashed #ccc;border-radius:8px;padding:12px;text-align:center;user-select:all;word-break:break-all">'+esc(password)+'</div>'+
    '<div class="note-box" style="margin:12px 0">এটা সেলারকে নিরাপদে জানিয়ে দিন। বন্ধ করার পর আর দেখা যাবে না — দরকার হলে আবার রিসেট করতে হবে।</div>'+
    '<div class="row-actions"><button class="btn" id="secCopy">📋 কপি</button><button class="btn gray" id="secClose">বন্ধ করুন</button></div></div>';
  document.body.appendChild(o);
  byId('secCopy').onclick = () => { navigator.clipboard&&navigator.clipboard.writeText(password).then(()=>{byId('secCopy').textContent='✅ কপি হয়েছে'}); };
  byId('secClose').onclick = () => o.remove();
}

/* ============ SELLERS ============ */
let SELLERS_CACHE = [], SELLER_FILTER = {q:'', status:''};
async function renderSellers(){
  const c = byId('tabContent');
  try{
    const qs = new URLSearchParams(); if(SELLER_FILTER.q) qs.set('q',SELLER_FILTER.q); if(SELLER_FILTER.status) qs.set('status',SELLER_FILTER.status);
    const {sellers, settings} = await adminApi('/admin/sellers'+(qs.toString()?'?'+qs:''));
    SELLERS_CACHE = sellers;
    c.innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <h2 style="margin:0">🏪 সেলার ম্যানেজমেন্ট (${sellers.length})</h2>
          <button class="btn" onclick="openSellerForm()">➕ নতুন সেলার</button>
        </div>
        <div class="grid3" style="margin-top:12px">
          <div class="field" style="margin:0"><input id="sq" placeholder="🔍 নাম / স্টোর / ইউজারনেম / ফোন" value="${esc(SELLER_FILTER.q)}" onkeydown="if(event.key==='Enter')applySellerFilter()" /></div>
          <div class="field" style="margin:0"><select id="sst" onchange="applySellerFilter()">
            <option value="">সব স্ট্যাটাস</option>${['active','suspended','blocked'].map(s=>`<option value="${s}" ${SELLER_FILTER.status===s?'selected':''}>${esc(ST_BADGE[s][0])}</option>`).join('')}
          </select></div>
          <div><button class="btn gray" onclick="applySellerFilter()">খুঁজুন</button></div>
        </div>
      </div>
      <div id="sellerFormWrap"></div>
      <div class="card" style="padding:8px"><div style="overflow-x:auto"><table style="min-width:900px">

async function uploadSellerLogo(input){
  const f = input.files[0]; if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  try{
    const r = await fetch(API+'/admin/upload',{method:'POST',headers:ADMIN_KEY?{'X-Admin-Key':ADMIN_KEY}:{},body:fd});
    const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'আপলোড ব্যর্থ');
    byId('sf_logo').value = j.url; showMsg('✅ লোগো আপলোড হয়েছে','ok');
  }catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
async function saveSeller(ev, id){
  ev.preventDefault();
  const g = k => { const el = byId(k); return el ? el.value.trim() : undefined; };
  const body = { name:g('sf_name'), store_name:g('sf_store'), phone:g('sf_phone'), email:g('sf_email'), address:g('sf_address'), description:g('sf_desc'), logo:g('sf_logo') };
  if(byId('sf_username') && !byId('sf_username').disabled) body.username = g('sf_username');
  try{
    if(id){
      if(byId('sf_slug')) body.slug = g('sf_slug');
      await adminApi('/admin/sellers/'+id,'PUT',body); showMsg('✅ সেলার আপডেট হয়েছে','ok'); renderSellers();
    }else{
      if(g('sf_password')) body.password = g('sf_password');
      body.status = g('sf_status'); if(g('sf_trial')!=='') body.trial_days = Number(g('sf_trial'));
      const j = await adminApi('/admin/sellers','POST',body);
      showMsg('✅ সেলার তৈরি হয়েছে','ok'); renderSellers();
      if(j.generated_password) showSecret('🎉 সেলার তৈরি হয়েছে', j.seller.username, j.generated_password);
    }
  }catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
async function setSellerStatus(id, status){
  const t = {suspended:'সাসপেন্ড',blocked:'ব্লক',active:'অ্যাক্টিভ'}[status];
  if(!confirm('এই সেলারকে '+t+' করতে চান?'+(status!=='active'?' — সাথে সাথে লগআউট হবে ও এর পণ্য সাইটে দেখাবে না।':''))) return;
  try{ await adminApi('/admin/sellers/'+id+'/status','PATCH',{status}); showMsg('✅ স্ট্যাটাস আপডেট হয়েছে','ok'); (byId('sellerDetail')?viewSeller(id):renderSellers()); }
  catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
async function resetSellerPw(id){
  if(!confirm('নতুন র‍্যান্ডম পাসওয়ার্ড তৈরি হবে এবং সেলার সব ডিভাইস থেকে লগআউট হবে। চালিয়ে যাবেন?')) return;
  try{ const j = await adminApi('/admin/sellers/'+id+'/reset-password','POST',{}); const s = SELLERS_CACHE.find(x=>x.id===id);
    showSecret('🔑 নতুন পাসওয়ার্ড', s&&s.username, j.generated_password); }
  catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
async function deleteSeller(id){
  if(!confirm('এই সেলারকে ডিলিট (নিষ্ক্রিয়) করবেন? লগইন বন্ধ হবে; পণ্য ও অর্ডারের ইতিহাস থেকে যাবে।')) return;
  try{ await adminApi('/admin/sellers/'+id,'DELETE'); showMsg('🗑️ সেলার নিষ্ক্রিয় করা হয়েছে','ok'); renderSellers(); }
  catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}

function subscriptionCard(s, sub, plans, history){

      <div class="field"><select id="ss_plan">${plans.map(p=>`<option value="${p.id}">${esc(p.name)} — ${taka(p.price)} / ${p.duration_days} দিন</option>`).join('')||'<option value="">কোনো সক্রিয় প্ল্যান নেই</option>'}</select></div>
      <div class="field"><select id="ss_method"><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="rocket">Rocket</option><option value="bank">ব্যাংক</option><option value="cash">ক্যাশ</option><option value="other">অন্যান্য</option></select></div>

    <div class="divider"></div><label>ইতিহাস</label><div style="overflow-x:auto"><table style="min-width:520px"><thead><tr><th>ধরন</th><th>প্ল্যান</th><th>পরিমাণ</th><th>মাধ্যম / রেফ</th><th>মেয়াদ</th><th>নোট</th></tr></thead><tbody>
      ${history.map(h=>`<tr><td>${esc(KIND[h.kind]||h.kind)}</td><td>${esc(h.plan_name||'—')}</td><td>${h.amount?taka(h.amount):'—'}</td><td>${esc(h.payment_method||'—')} ${esc(h.payment_ref||'')}</td><td><small>${dt(h.starts_at)} → ${dt(h.ends_at)}</small></td><td><small>${esc(h.note||'')}</small></td></tr>`).join('')}</tbody></table></div></div>`;

async function sellerSub(id, action){
  const body = {action};
  if(action==='extend_trial') body.days = Number(byId('ss_days').value);
  if(action==='set_override') body.value = byId('ss_ovr').value || null;
  if(action==='activate_plan'){ body.plan_id = Number(byId('ss_plan').value); body.payment_method = byId('ss_method').value; body.payment_ref = byId('ss_ref').value.trim(); }

async function saveMkSettings(ev){
  ev.preventDefault();
  try{ await adminApi('/admin/marketplace-settings','PUT',{ trial_days:Number(byId('mk_trial').value), grace_days:Number(byId('mk_grace').value), default_commission_percent:Number(byId('mk_comm').value), expired_behavior:byId('mk_exp').value, subscription_required:byId('mk_req').checked });
    showMsg('✅ সেটিংস সংরক্ষণ হয়েছে','ok'); }catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
function resetPlanForm(){ ['pl_id','pl_name','pl_price','pl_days','pl_limit','pl_desc'].forEach(i=>byId(i).value=''); byId('pl_active').checked=true; byId('planFormTitle').textContent='➕ নতুন প্ল্যান'; }
function editPlan(id){
  const p = PLANS_CACHE.find(x=>x.id===id); if(!p) return;
  byId('pl_id').value=p.id; byId('pl_name').value=p.name; byId('pl_price').value=p.price; byId('pl_days').value=p.duration_days;
  byId('pl_limit').value=p.product_limit||''; byId('pl_desc').value=p.description||''; byId('pl_active').checked=!!p.active;
  byId('planFormTitle').textContent='✏️ প্ল্যান সম্পাদনা'; window.scrollTo({top:0,behavior:'smooth'});
}
async function savePlan(ev){
  ev.preventDefault();
  const body = { id:byId('pl_id').value||undefined, name:byId('pl_name').value.trim(), price:Number(byId('pl_price').value), duration_days:Number(byId('pl_days').value),
    product_limit:byId('pl_limit').value||undefined, description:byId('pl_desc').value.trim(), active:byId('pl_active').checked };
  try{ await adminApi('/admin/subscription-plans','POST',body); showMsg('✅ প্ল্যান সংরক্ষণ হয়েছে','ok'); renderSubscriptions(); }
  catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
async function deletePlan(id){
  if(!confirm('এই প্ল্যান মুছতে চান? (কোনো সেলার ব্যবহার করে থাকলে শুধু নিষ্ক্রিয় হবে)')) return;
  try{ const j = await adminApi('/admin/subscription-plans?id='+id,'DELETE'); showMsg(j.deactivated?'ℹ️ প্ল্যানটি ব্যবহৃত, তাই শুধু নিষ্ক্রিয় করা হয়েছে':'🗑️ প্ল্যান মুছে ফেলা হয়েছে','ok'); renderSubscriptions(); }
  catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}

/* ============ TABS ============ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  const c = document.getElementById('tabContent');
  c.innerHTML = '<div class="spinner">লোড হচ্ছে…</div>';
  if(name==='products') renderProducts();
  else if(name==='categories') renderCategories();
  else if(name==='settings') renderSettings();
  else if(name==='hometext') renderHomeText();
  else if(name==='orders'){ renderOrders(); markOrdersSeen(); }
  else if(name==='dashboard') renderDashboard();
  else if(name==='sellers') renderSellers();
  else if(name==='subscriptions') renderSubscriptions();
  else if(name==='customers') renderCustomers();
  else if(name==='coupons') renderCoupons();
  else if(name==='banners') renderBanners();
  else if(name==='reviews') renderReviews();
  else if(name==='security') renderSecurity();
  else if(name==='backup') renderBackup();
}

function stockBadge(p){
  if(p.stock===null||p.stock===undefined) return '<span style="color:#bbb">—</span>';
  if(p.stock<=0) return '<span class="badge danger">স্টক শেষ</span>';
  if(p.stock<=(p.low_stock_at||5)) return `<span class="badge warn">মাত্র ${p.stock}টি</span>`;
  return `<span class="badge ok">${p.stock}টি</span>`;
}
let PRODUCTS_MAP = new Map();
function filterProductRows(q){
  q=(q||'').trim().toLowerCase();
  const sf=(document.getElementById('prodSellerFilter')||{}).value||'';
  document.querySelectorAll('#prodTableBody tr').forEach(tr=>{
    tr.style.display = (tr.dataset.search.includes(q) && (!sf || tr.dataset.seller===sf)) ? '' : 'none';
  });
}
function openStockAdjustById(id){ const p=PRODUCTS_MAP.get(id); if(p) openStockAdjust(p.id,p.name||'',p.stock??null); }

function toggleAllProducts(on){ document.querySelectorAll('#prodTableBody tr').forEach(tr=>{ if(tr.style.display!=='none'){ const c=tr.querySelector('.pchk'); if(c) c.checked=on; } }); updateXferCount(); }

function editProduct(p){
  document.getElementById('p_id').value=p.id;
  document.getElementById('p_name').value=p.name||'';
  document.getElementById('p_name_en').value=p.name_en||'';
  document.getElementById('p_cat').value=p.cat||'';
  document.getElementById('p_price').value=p.price||'';
  document.getElementById('p_old').value=p.old||'';
  document.getElementById('p_e').value=p.e||'';
  document.getElementById('p_r').value=p.r||'';
  document.getElementById('p_rv').value=p.rv||'';
  document.getElementById('p_sold').value=p.sold||'';
  document.getElementById('p_tag').value=p.tag||'';
  document.getElementById('p_colors').value=(p.colors||[]).join(', ');
  document.getElementById('p_sizes').value=(p.sizes||[]).join(', ');
  document.getElementById('p_f').checked=!!p.f;
  document.getElementById('p_status').value=p.status||'active';
  if(p.seller_id) document.getElementById('p_seller').value=String(p.seller_id);
  document.getElementById('p_seller').disabled=true;   // মালিক বদলাতে ট্রান্সফার ব্যবহার করুন
  document.getElementById('p_img').value=p.img||'';
  document.getElementById('p_sku').value=p.sku||'';
  document.getElementById('p_stock').value=(p.stock===null||p.stock===undefined)?'':p.stock;
  document.getElementById('p_low_stock').value=p.low_stock_at||'';
  document.getElementById('p_img_file').value='';
  document.getElementById('p_img_status').textContent='';
  const prev=document.getElementById('p_img_preview');
  if(p.img){ prev.src=p.img; prev.style.display='block'; } else { prev.src=''; prev.style.display='none'; }
  window.scrollTo({top:0,behavior:'smooth'});
}
async function saveProduct(ev){
  ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const splitList = s => s.split(',').map(x=>x.trim()).filter(Boolean);
  const body = {
    id: val('p_id') || undefined,
    name: val('p_name'), name_en: val('p_name_en'), cat: val('p_cat'),
    price: Number(val('p_price')), old: val('p_old')?Number(val('p_old')):undefined,
    e: val('p_e'), img: val('p_img') || undefined,
    r: val('p_r')?Number(val('p_r')):undefined, rv: val('p_rv')?Number(val('p_rv')):undefined,
    sold: val('p_sold')?Number(val('p_sold')):undefined, tag: val('p_tag'),
    colors: splitList(val('p_colors')), sizes: splitList(val('p_sizes')),
    sku: val('p_sku'), stock: val('p_stock'), low_stock_at: val('p_low_stock'),
    f: document.getElementById('p_f').checked,
    status: document.getElementById('p_status').value
  };
  if(!body.id) body.seller_id = Number(document.getElementById('p_seller').value) || undefined;
  try{
    await adminApi('/admin/products','POST',body);
    showMsg('✅ পণ্য সংরক্ষণ হয়েছে','ok');
    resetProductForm();
    renderProducts();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}
async function deleteProduct(id){
  if(!confirm('আপনি কি নিশ্চিত এই পণ্যটি মুছে ফেলতে চান?')) return;
  try{
    const r = await adminApi('/admin/products?id='+id,'DELETE');
    showMsg(r.archived ? '📦 '+esc(r.message) : '🗑️ পণ্য মুছে ফেলা হয়েছে','ok');
    renderProducts();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

let ORDERS_MAP = new Map();
async function updateSellerParcel(orderId, sellerId, status){
  if(!status) return;
  try{
    const r = await adminApi('/admin/order-items','PATCH',{order_id:orderId, seller_id:sellerId, status});
    showMsg('✅ সেলারের পার্সেল আপডেট হয়েছে (অর্ডারের অবস্থা: '+esc(STATUS_L[r.order_status]||r.order_status)+')','ok'); loadOrdersList();
  }catch(e){ showMsg('❌ '+esc(e.message),'error'); }
}
async function updateOrderField(id, field, value){
  try{
    await adminApi('/admin/orders','PATCH',{id, [field]: value});
    showMsg('✅ আপডেট হয়েছে','ok'); if(field==='status') loadOrdersList();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}
async function toggleOrderHistory(id){
  const row = document.getElementById('ordHist-'+id);
  const body = document.getElementById('ordHistBody-'+id);
  if(!row.classList.contains('hidden')){ row.classList.add('hidden'); return; }
  row.classList.remove('hidden');
  body.innerHTML = 'লোড হচ্ছে…';
  try{
    const {history} = await adminApi('/admin/orders/history?id='+id);
    body.innerHTML = history.length ? history.map(h=>`<div style="font-size:12.5px;padding:4px 0;border-bottom:1px solid #eee">${STATUS_L[h.status]||h.status} — <small style="color:#888">${(h.created_at||'').slice(0,16)}</small>${h.note?' — '+esc(h.note):''}</div>`).join('') : '<span style="color:#888;font-size:12.5px">কোনো ইতিহাস নেই</span>';
  }catch(e){ body.innerHTML = '<span style="color:#c22;font-size:12.5px">'+e.message+'</span>'; }
}
function printInvoice(o){
  let items=[]; try{ items = typeof o.items==='string' ? JSON.parse(o.items) : o.items; }catch(e){ items=[]; }
  const itemsHtml = (o.order_items||[]).length
    ? o.order_items.map(i=>`<div>${esc(i.name)} × ${esc(i.quantity)} — ৳${esc(i.subtotal)} <small style="color:#888">(সেলার: ${esc(i.seller_name||'—')})</small></div>`).join('')
    : (Array.isArray(items) ? items.map(i=>`<div>${esc(typeof i==='string'?i:JSON.stringify(i))}</div>`).join('') : esc(String(items)));
  const w = window.open('','_blank');
  w.document.write(`
    <html><head><title>ইনভয়েস ${esc(o.order_no)}</title>
    <style>body{font-family:sans-serif;padding:30px;max-width:600px;margin:0 auto}

    <body>
    <h1>NextGenTechBD — ইনভয়েস</h1>
    <div class="row"><b>অর্ডার নং:</b><span>${esc(o.order_no)}</span></div>
    <div class="row"><b>তারিখ:</b><span>${esc((o.created_at||'').slice(0,16))}</span></div>

    <div class="row"><b>ফোন:</b><span>${esc(o.phone)}</span></div>
    <div class="row"><b>ঠিকানা:</b><span>${esc(o.address||'')} ${esc(o.district||'')}</span></div>
    <div class="row"><b>পেমেন্ট:</b><span>${esc(o.payment||'-')} (${esc(PAY_STATUS_L[o.payment_status]||o.payment_status||'')})</span></div>
    <div class="row"><b>কুরিয়ার:</b><span>${esc(o.courier||'-')} ${o.tracking_id?'('+esc(o.tracking_id)+')':''}</span></div>
    <hr><h3>পণ্যসমূহ</h3>${itemsHtml}<hr>
    <div class="row"><span>সাবটোটাল</span><span>৳${esc(o.subtotal)}</span></div>
    <div class="row"><span>ডেলিভারি চার্জ</span><span>৳${esc(o.delivery_fee||0)}</span></div>
    ${o.discount?`<div class="row"><span>ছাড় (${esc(o.coupon_code||'')})</span><span>-৳${esc(o.discount)}</span></div>`:''}
    <div class="row total"><span>সর্বমোট</span><span>৳${esc(o.total)}</span></div>
    <script>window.print()<\/script>
    </body></html>`);
  w.document.close();
}

async function uploadBannerImage(input){
  const file = input.files[0]; if(!file) return;
  const statusEl = document.getElementById('bn_img_status');
  const prev = document.getElementById('bn_img_preview');
  prev.src = URL.createObjectURL(file); prev.style.display='block';
  statusEl.textContent = '⏳ আপলোড হচ্ছে…';
  try{
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(API+'/admin/upload', { method:'POST', headers:(ADMIN_KEY?{'X-Admin-Key':ADMIN_KEY}:{}), body:fd });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'আপলোড ব্যর্থ হয়েছে');
    document.getElementById('bn_img').value = j.url;
    prev.src = j.url;
    statusEl.textContent = '✅ ছবি আপলোড হয়েছে';
  }catch(e){ statusEl.textContent = '❌ '+e.message; }
}

/* ============ BACKUP & EXPORT ============ */
function toCSV(rows, headers){
  const esc = v => '"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"';
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>esc(r[h])).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, csv){
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
async function exportProductsCSV(){
  try{
    const {products} = await adminApi('/admin/products');
    downloadCSV('products.csv', toCSV(products, ['id','name','name_en','cat','price','old','sku','stock','sold','f']));
    showMsg('✅ এক্সপোর্ট হয়েছে','ok');
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

  try{

}

}
