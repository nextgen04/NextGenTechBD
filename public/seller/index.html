<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>NextGenTechBD — Seller ড্যাশবোর্ড</title>
<link rel="icon" href="/assets/logo-icon.png" />
<style>
:root{--orange:#F85606;--orange-dark:#e04a04;--bg:#f4f4f4;--card:#fff;--text:#222;--muted:#8a8a8a;--border:#ececec;--radius:10px;--shadow:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;padding:9px 10px;border:1px solid #ddd;border-radius:8px;width:100%;background:#fff}
label{font-size:12.5px;color:#555;font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.btn{background:var(--orange);color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13.5px}
.btn:hover{background:var(--orange-dark)}
.btn.gray{background:#eee;color:#333}.btn.gray:hover{background:#ddd}
.btn.red{background:#d92646;color:#fff}.btn.small{padding:6px 10px;font-size:12.5px}
.container{max-width:1100px;margin:0 auto;padding:16px}
.hidden{display:none !important}
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:32px 28px;max-width:380px;width:100%}
.login-card h2{font-size:18px;margin:10px 0 4px;color:var(--orange-dark)}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:18px}
.login-err{color:#d92646;font-size:13px;margin-top:8px;display:none}
header.topbar{background:#fff;box-shadow:0 1px 0 var(--border);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;color:var(--orange-dark);font-size:15px}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:13px;color:#555;cursor:pointer}
.tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:14px;color:var(--orange-dark)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:11.5px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.ok{background:#e8f8ef;color:#0a7a3d}.msg.error{background:#fdeaea;color:#c22}
.spinner{text-align:center;padding:30px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat-card .n{font-size:24px;font-weight:800;color:var(--orange-dark)}.stat-card .l{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:#e8f8ef;color:#0a7a3d}.badge.warn{background:#fff3d6;color:#a06b00}.badge.danger{background:#fdeaea;color:#c22}
.note-box{background:#fff8e6;border:1px solid #ffe4a3;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7a5900;margin-bottom:14px}
.lock{color:#999;font-size:13px;padding:14px;background:#fafafa;border-radius:8px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px}
.bar-row .lbl{width:90px;flex-shrink:0}.bar-row .bar-wrap{flex:1;background:#f0f0f0;border-radius:6px;height:14px;overflow:hidden}
.bar-row .bar-fill{background:var(--orange);height:100%}.bar-row .val{width:80px;text-align:right;color:var(--muted)}
.order-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.imggrid div{border:1px solid var(--border);border-radius:8px;padding:6px;font-size:11px;text-align:center}
.imggrid img{width:100%;height:90px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="login-card">
    <img src="/assets/logo.png" alt="NextGenTechBD" style="height:30px">
    <h2>🏪 Seller লগইন</h2>
    <p>আপনার দোকানের ইমেইল ও পাসওয়ার্ড দিয়ে ঢুকুন। অ্যাকাউন্ট নেই? Super Admin-এর সাথে যোগাযোগ করুন।</p>
    <div class="field"><label>ইমেইল</label><input type="email" id="lgEmail" autocomplete="username" /></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="lgPw" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn" style="width:100%" onclick="doLogin()">লগইন করুন</button>
    <div class="login-err" id="lgErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><img src="/assets/logo-icon.png" alt="" style="height:24px;vertical-align:middle;margin-right:6px">🏪 <span id="shopName"></span></div>
    <button class="btn gray small" onclick="doLogout()">লগআউট</button>
  </div></header>
  <div class="container">
    <div class="tabs" id="tabsBar"></div>
    <div id="msgBox"></div>
    <div id="tabContent"></div>
  </div>
</div>

<script>
const API='/api';
let TOKEN=null, ME=null, CATS=[];
try{ TOKEN=sessionStorage.getItem('sellerToken'); }catch(e){}

function esc(v){return String(v===null||v===undefined?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
const can = k => !!(ME && ME.permissions && ME.permissions[k]);
const STATUS_L={pending:'🕐 নতুন',processing:'⚙️ প্রসেসিং',confirmed:'✔ নিশ্চিত',shipped:'🚚 পাঠানো হয়েছে',delivered:'✅ ডেলিভার্ড',cancelled:'✖ বাতিল',returned:'↩️ রিটার্ন'};

async function api(path, method='GET', body, isForm){
  const headers={'X-Seller-Token':TOKEN||''};
  if(body!==undefined && !isForm) headers['Content-Type']='application/json';
  const r=await fetch(API+path,{method,headers,body: body===undefined?undefined:(isForm?body:JSON.stringify(body))});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ doLogout(true); throw new Error('সেশন শেষ — আবার লগইন করুন'); }
  if(!r.ok) throw new Error(j.error||'একটি সমস্যা হয়েছে');
  return j;
}
function showMsg(text,type){const b=document.getElementById('msgBox');b.innerHTML='<div class="msg '+esc(type)+'">'+esc(text)+'</div>';setTimeout(()=>{b.innerHTML='';},4500);window.scrollTo({top:0,behavior:'smooth'});}

/* ===== লগইন ===== */
async function doLogin(){
  const err=document.getElementById('lgErr'); err.style.display='none';
  try{
    const r=await fetch(API+'/seller/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('lgEmail').value,password:document.getElementById('lgPw').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'লগইন করা যায়নি');
    TOKEN=j.token; try{sessionStorage.setItem('sellerToken',TOKEN);}catch(e){}
    document.getElementById('lgPw').value='';
    await boot();
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
}
async function doLogout(silent){
  try{ if(TOKEN && !silent) await fetch(API+'/seller/logout',{method:'POST',headers:{'X-Seller-Token':TOKEN}}); }catch(e){}
  TOKEN=null; ME=null; try{sessionStorage.removeItem('sellerToken');}catch(e){}
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginWrap').classList.remove('hidden');
}
async function boot(){
  try{
    const j=await api('/seller/me');
    ME={...j.seller, summary:j.summary};
    try{ const p=await (await fetch(API+'/products')).json(); CATS=p.categories||[]; }catch(e){ CATS=[]; }
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('shopName').textContent=ME.shop_name;
    buildTabs(); switchTab('home');
  }catch(e){ if(TOKEN) doLogout(true); }
}
function buildTabs(){
  const t=[['home','🏠 ওভারভিউ'],['products','🛍️ আমার পণ্য']];
  if(can('can_stock_manage')) t.push(['stock','📊 স্টক']);
  if(can('can_order_manage')) t.push(['orders','📦 অর্ডার']);
  if(can('can_sales_report')) t.push(['reports','💹 বিক্রয় রিপোর্ট']);
  if(can('can_product_create')||can('can_product_edit')) t.push(['images','🖼️ ছবি']);
  document.getElementById('tabsBar').innerHTML=t.map(x=>`<div class="tab" data-tab="${x[0]}" onclick="switchTab('${x[0]}')">${x[1]}</div>`).join('');
}
function switchTab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===n));
  document.getElementById('tabContent').innerHTML='<div class="spinner">লোড হচ্ছে…</div>';
  ({home:renderHome,products:renderProducts,stock:renderStock,orders:renderOrders,reports:renderReports,images:renderImages})[n]();
}
const fail = e => { document.getElementById('tabContent').innerHTML='<div class="msg error">'+esc(e.message)+'</div>'; };
const PERM_NAMES={can_product_create:'পণ্য তৈরি',can_product_edit:'পণ্য এডিট',can_product_delete:'পণ্য মুছা',can_order_manage:'অর্ডার ম্যানেজমেন্ট',can_stock_manage:'স্টক ম্যানেজমেন্ট',can_sales_report:'সেলস রিপোর্ট'};

/* ===== ওভারভিউ ===== */
async function renderHome(){
  try{
    const j=await api('/seller/me'); ME={...j.seller,summary:j.summary}; const s=j.summary;
    document.getElementById('tabContent').innerHTML=`
      <div class="stat-grid">
        <div class="stat-card"><div class="n">${esc(s.products)}</div><div class="l">আমার পণ্য</div></div>
        <div class="stat-card"><div class="n">${esc(s.low_stock)}</div><div class="l">লো/শূন্য স্টক পণ্য</div></div>
        <div class="stat-card"><div class="n">${s.pending_orders===null?'🔒':esc(s.pending_orders)}</div><div class="l">অপেক্ষমান অর্ডার</div></div>
      </div>
      <div class="card"><h2>🔐 আমার অনুমতি (Super Admin নির্ধারিত)</h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${Object.keys(PERM_NAMES).map(k=>`<span class="badge ${can(k)?'ok':'danger'}">${can(k)?'✔':'✖'} ${PERM_NAMES[k]}</span>`).join('')}</div>
        <p style="margin-top:10px;color:#888;font-size:12.5px">কোনো অনুমতি দরকার হলে Super Admin-কে জানান। আপনি শুধু নিজের পণ্য ও নিজের অংশের অর্ডার দেখতে পান।</p></div>`;
  }catch(e){fail(e);}
}

/* ===== পণ্য ===== */
async function renderProducts(){
  try{
    const {products}=await api('/seller/products');
    const canForm=can('can_product_create')||can('can_product_edit'), canStock=can('can_stock_manage');
    document.getElementById('tabContent').innerHTML=`
      ${canForm?`<div class="card"><h2>➕ পণ্য যোগ / সম্পাদনা</h2>
        ${!canStock?'<div class="note-box">স্টক সংখ্যা সেট করার অনুমতি আপনার নেই — নতুন পণ্যের স্টক ০ থাকবে, Super Admin স্টক সেট করে দেবেন।</div>':''}
        <form onsubmit="saveProduct(event)">
          <input type="hidden" id="p_id" />
          <div class="grid3">
            <div class="field"><label>নাম (বাংলা) *</label><input id="p_name" required maxlength="200" /></div>
            <div class="field"><label>Name (English)</label><input id="p_name_en" maxlength="200" /></div>
            <div class="field"><label>ক্যাটাগরি *</label><select id="p_cat" required>${CATS.map(c=>`<option value="${esc(c.id)}">${esc(c.e||'')} ${esc(c.name)}</option>`).join('')}</select></div>
          </div>
          <div class="grid3">
            <div class="field"><label>বিক্রয় মূল্য (৳) *</label><input id="p_price" type="number" min="1" step="1" required /></div>
            <div class="field"><label>আগের মূল্য (৳)</label><input id="p_old" type="number" min="0" step="1" /></div>
            <div class="field"><label>ইমোজি আইকন</label><input id="p_e" maxlength="8" placeholder="📱" style="width:80px;text-align:center" /></div>
          </div>
          <div class="field"><label>পণ্যের ছবি (সর্বোচ্চ ৫MB, আপলোডে সাথে সাথে লাইভ)</label>
            <input type="file" id="p_file" accept="image/*" onchange="uploadImg(this)" />
            <input type="hidden" id="p_img" /><div id="p_img_status" style="font-size:12px;color:#888;margin-top:6px"></div>
            <img id="p_prev" style="display:none;max-width:110px;max-height:110px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid #eee" /></div>
          <div class="grid3">
            <div class="field"><label>SKU</label><input id="p_sku" maxlength="60" /></div>
            <div class="field"><label>রং (কমা দিয়ে)</label><input id="p_colors" placeholder="কালো, সাদা" /></div>
            <div class="field"><label>সাইজ (কমা দিয়ে)</label><input id="p_sizes" placeholder="S, M, L" /></div>
          </div>
          ${canStock?`<div class="grid3"><div class="field"><label>বর্তমান স্টক</label><input id="p_stock" type="number" min="0" step="1" placeholder="খালি = ট্র্যাক হবে না" /></div>
            <div class="field"><label>লো-স্টক অ্যালার্ট</label><input id="p_low" type="number" min="0" step="1" placeholder="৫" /></div></div>`:''}
          <div class="row-actions"><button class="btn" type="submit">💾 সংরক্ষণ</button><button type="button" class="btn gray" onclick="resetForm()">✖ ফর্ম খালি</button></div>
        </form></div>`:'<div class="lock">🔒 পণ্য তৈরি/এডিটের অনুমতি আপনার নেই। শুধু দেখতে পারবেন।</div>'}
      <div class="card"><h2>🛍️ আমার পণ্য (${products.length})</h2>
        ${products.length?`<div style="overflow-x:auto"><table><thead><tr><th>নাম</th><th>মূল্য</th><th>স্টক</th><th></th></tr></thead><tbody>
        ${products.map(p=>`<tr><td>${p.img?`<img src="${esc(p.img)}" style="width:30px;height:30px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px">`:''}${esc(p.e||'')} ${esc(p.name)}<br><small style="color:#999">${esc(p.sku||'')}</small></td>
          <td>৳${esc(p.price)}${p.old?` <s style="color:#aaa">৳${esc(p.old)}</s>`:''}</td>
          <td>${stockBadge(p)}</td>
          <td><div class="row-actions">
            ${can('can_product_edit')?`<button class="btn gray small" data-obj="${esc(JSON.stringify(p))}" onclick="editProduct(JSON.parse(this.dataset.obj))">✏️ এডিট</button>`:''}
            ${can('can_product_delete')?`<button class="btn red small" onclick="delProduct(${Number(p.id)})">🗑️</button>`:''}
          </div></td></tr>`).join('')}</tbody></table></div>`:'<p style="color:#888">এখনো কোনো পণ্য নেই।</p>'}
      </div>`;
  }catch(e){fail(e);}
}
function stockBadge(p){
  if(p.stock===null||p.stock===undefined) return '<span style="color:#bbb">—</span>';
  if(p.stock<=0) return '<span class="badge danger">শেষ</span>';
  if(p.stock<=(p.low_stock_at||5)) return `<span class="badge warn">মাত্র ${esc(p.stock)}টি</span>`;
  return `<span class="badge ok">${esc(p.stock)}</span>`;
}
function resetForm(){
  ['p_id','p_name','p_name_en','p_price','p_old','p_e','p_img','p_sku','p_colors','p_sizes','p_stock','p_low'].forEach(i=>{const el=document.getElementById(i); if(el) el.value='';});
  const f=document.getElementById('p_file'); if(f) f.value=''; document.getElementById('p_img_status').textContent='';
  const pv=document.getElementById('p_prev'); pv.src=''; pv.style.display='none';
}
function editProduct(p){
  const set=(i,v)=>{const el=document.getElementById(i); if(el) el.value=(v===null||v===undefined)?'':v;};
  set('p_id',p.id);set('p_name',p.name);set('p_name_en',p.name_en);set('p_cat',p.cat);set('p_price',p.price);set('p_old',p.old);set('p_e',p.e);set('p_img',p.img);set('p_sku',p.sku);
  set('p_colors',(p.colors||[]).join(', '));set('p_sizes',(p.sizes||[]).join(', '));set('p_stock',p.stock);set('p_low',p.low_stock_at);
  const pv=document.getElementById('p_prev'); if(p.img){pv.src=p.img;pv.style.display='block';}else{pv.src='';pv.style.display='none';}
  window.scrollTo({top:0,behavior:'smooth'});
}
async function uploadImg(input){
  const file=input.files[0]; if(!file) return;
  const st=document.getElementById('p_img_status'); st.textContent='⏳ আপলোড হচ্ছে…';
  try{
    const fd=new FormData(); fd.append('file',file);
    const j=await api('/seller/upload','POST',fd,true);
    document.getElementById('p_img').value=j.url; st.textContent='✅ আপলোড হয়েছে';
    const pv=document.getElementById('p_prev'); pv.src=j.url; pv.style.display='block';
  }catch(e){ st.textContent='❌ '+e.message; }
}
async function saveProduct(ev){
  ev.preventDefault();
  const v=i=>{const el=document.getElementById(i); return el?el.value.trim():'';};
  const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
  const body={id:v('p_id')||undefined,name:v('p_name'),name_en:v('p_name_en'),cat:v('p_cat'),price:Number(v('p_price')),old:v('p_old')?Number(v('p_old')):undefined,e:v('p_e'),img:v('p_img')||undefined,sku:v('p_sku'),colors:list(v('p_colors')),sizes:list(v('p_sizes'))};
  if(can('can_stock_manage')){ body.stock=v('p_stock'); body.low_stock_at=v('p_low'); }
  try{ await api('/seller/products','POST',body); showMsg('✅ পণ্য সংরক্ষণ হয়েছে','ok'); renderProducts(); }
  catch(e){ showMsg('❌ '+e.message,'error'); }
}
async function delProduct(id){
  if(!confirm('এই পণ্যটি মুছে ফেলবেন?')) return;
  try{ await api('/seller/products?id='+id,'DELETE'); showMsg('✅ মুছে ফেলা হয়েছে','ok'); renderProducts(); }
  catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ===== স্টক ===== */
async function renderStock(){
  try{
    const {products}=await api('/seller/products');
    document.getElementById('tabContent').innerHTML=`<div class="card"><h2>📊 স্টক ম্যানেজমেন্ট</h2>
      ${products.length?`<div style="overflow-x:auto"><table><thead><tr><th>পণ্য</th><th>স্টক</th><th>পরিবর্তন (+/−)</th><th>কারণ</th><th></th></tr></thead><tbody>
      ${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${stockBadge(p)}</td>
        <td><input type="number" step="1" id="sc_${Number(p.id)}" placeholder="+10 / -3" style="width:110px" /></td>
        <td><input id="sr_${Number(p.id)}" placeholder="নতুন চালান / ড্যামেজ" maxlength="200" /></td>
        <td><button class="btn small" onclick="adjustStock(${Number(p.id)})">✔ আপডেট</button></td></tr>`).join('')}</tbody></table></div>`:'<p style="color:#888">কোনো পণ্য নেই।</p>'}</div>`;
  }catch(e){fail(e);}
}
async function adjustStock(id){
  const ch=Number(document.getElementById('sc_'+id).value);
  if(!Number.isInteger(ch)||ch===0){ showMsg('❌ শূন্য ছাড়া পূর্ণসংখ্যা দিন','error'); return; }
  try{ await api('/seller/stock','POST',{product_id:id,change:ch,reason:document.getElementById('sr_'+id).value}); showMsg('✅ স্টক আপডেট হয়েছে','ok'); renderStock(); }
  catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ===== অর্ডার ===== */
let OF={q:'',status:''};
async function renderOrders(){
  document.getElementById('tabContent').innerHTML=`<div class="card"><h2>📦 আমার অংশের অর্ডার</h2>
    <div class="grid3"><div class="field"><input id="oq" placeholder="🔍 অর্ডার নং / নাম / ফোন" value="${esc(OF.q)}" /></div>
    <div class="field"><select id="os"><option value="">সব অবস্থা</option>${Object.keys(STATUS_L).map(k=>`<option value="${k}" ${OF.status===k?'selected':''}>${STATUS_L[k]}</option>`).join('')}</select></div>
    <div class="field"><button class="btn" onclick="OF={q:document.getElementById('oq').value,status:document.getElementById('os').value};loadOrders()">খুঁজুন</button></div></div>
    <div id="ordList"><div class="spinner">লোড হচ্ছে…</div></div></div>`;
  loadOrders();
}
async function loadOrders(){
  const w=document.getElementById('ordList');
  try{
    const qs=new URLSearchParams(); if(OF.q) qs.set('q',OF.q); if(OF.status) qs.set('status',OF.status);
    const {orders}=await api('/seller/orders?'+qs.toString());
    w.innerHTML=orders.length?orders.map(o=>`<div class="order-card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${esc(o.order_no)}</b><small style="color:#888">${esc((o.created_at||'').slice(0,16))}</small></div>
      <div style="margin:6px 0"><b>${esc(o.customer.name)}</b> · ${esc(o.customer.phone)}<br><small>${esc(o.customer.address)}${o.customer.district?', '+esc(o.customer.district):''}</small>
        <br><small style="color:#888">পেমেন্ট: ${esc(o.payment||'-')} (${esc(o.payment_status||'unpaid')})${o.note?' · নোট: '+esc(o.note):''}</small></div>
      <div style="background:#fafafa;border-radius:8px;padding:8px;margin-bottom:8px">${o.items.map(i=>`• ${esc(i.name)} × ${esc(i.qty)} — ৳${esc(i.line_total)}`).join('<br>')}<br><b>আমার অংশের মোট: ৳${esc(o.my_total)}</b></div>
      <div class="grid3">
        <select id="st_${Number(o.order_id)}">${Object.keys(STATUS_L).map(k=>`<option value="${k}" ${o.status===k?'selected':''}>${STATUS_L[k]}</option>`).join('')}</select>
        <input id="co_${Number(o.order_id)}" placeholder="কুরিয়ার" value="${esc(o.courier||'')}" maxlength="60" />
        <input id="tr_${Number(o.order_id)}" placeholder="ট্র্যাকিং আইডি" value="${esc(o.tracking_id||'')}" maxlength="80" />
      </div>
      <div style="margin-top:8px"><button class="btn small" onclick="saveOrder(${Number(o.order_id)})">💾 আপডেট সংরক্ষণ</button></div></div>`).join(''):'<p style="color:#888">কোনো অর্ডার পাওয়া যায়নি।</p>';
  }catch(e){ w.innerHTML='<div class="msg error">'+esc(e.message)+'</div>'; }
}
async function saveOrder(id){
  try{ await api('/seller/orders','PATCH',{order_id:id,status:document.getElementById('st_'+id).value,courier:document.getElementById('co_'+id).value,tracking_id:document.getElementById('tr_'+id).value}); showMsg('✅ অর্ডার আপডেট হয়েছে','ok'); loadOrders(); }
  catch(e){ showMsg('❌ '+e.message,'error'); }
}

/* ===== রিপোর্ট ===== */
async function renderReports(){
  const today=new Date().toISOString().slice(0,10), from=new Date(Date.now()-29*86400000).toISOString().slice(0,10);
  document.getElementById('tabContent').innerHTML=`<div class="card"><h2>💹 বিক্রয় রিপোর্ট</h2>
    <div class="grid3"><div class="field"><label>থেকে</label><input type="date" id="rf" value="${from}" /></div><div class="field"><label>পর্যন্ত</label><input type="date" id="rt" value="${today}" /></div>
    <div class="field"><label>&nbsp;</label><button class="btn" onclick="loadReport()">দেখুন</button></div></div>
    <div class="note-box">বাতিল ও ফেরত দেওয়া অর্ডার হিসাবে ধরা হয় না। এখানে পণ্যের মূল বিক্রয় (মূল্য × পরিমাণ) দেখানো হয়; ডেলিভারি ফি/কুপন ছাড় প্ল্যাটফর্মের হিসাব।</div>
    <div id="repBody"><div class="spinner">লোড হচ্ছে…</div></div></div>`;
  loadReport();
}
async function loadReport(){
  const w=document.getElementById('repBody');
  try{
    const j=await api('/seller/reports?from='+document.getElementById('rf').value+'&to='+document.getElementById('rt').value);
    const max=Math.max(1,...j.daily.map(d=>d.revenue));
    w.innerHTML=`<div class="stat-grid"><div class="stat-card"><div class="n">৳${esc(j.totals.revenue)}</div><div class="l">মোট বিক্রয়</div></div>
      <div class="stat-card"><div class="n">${esc(j.totals.orders)}</div><div class="l">অর্ডার</div></div><div class="stat-card"><div class="n">${esc(j.totals.units)}</div><div class="l">বিক্রিত পিস</div></div></div>
      <h3 style="font-size:14px;margin:10px 0">📅 দিনভিত্তিক</h3>${j.daily.map(d=>`<div class="bar-row"><span class="lbl">${esc(d.day.slice(5))}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(d.revenue/max*100)}%"></div></div><span class="val">৳${esc(d.revenue)}</span></div>`).join('')||'<p style="color:#888">এই সময়ে কোনো বিক্রি নেই</p>'}
      <h3 style="font-size:14px;margin:14px 0 8px">🏆 সেরা পণ্য</h3>${j.top_products.length?`<table><thead><tr><th>পণ্য</th><th>পিস</th><th>বিক্রয়</th></tr></thead><tbody>${j.top_products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.units)}</td><td>৳${esc(p.revenue)}</td></tr>`).join('')}</tbody></table>`:'<p style="color:#888">—</p>'}
      <h3 style="font-size:14px;margin:14px 0 8px">📋 অর্ডারের অবস্থা</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${j.status_breakdown.map(s=>`<span class="badge warn">${esc(STATUS_L[s.status]||s.status)}: ${esc(s.orders)}</span>`).join('')||'—'}</div>`;
  }catch(e){ w.innerHTML='<div class="msg error">'+esc(e.message)+'</div>'; }
}

/* ===== ছবি লাইব্রেরি (Seller-ভিত্তিক Cloudinary ফোল্ডার) ===== */
async function renderImages(){
  const c=document.getElementById('tabContent');
  try{
    const {images}=await api('/seller/upload');
    c.innerHTML=`<div class="card"><h2>🖼️ আমার ছবির লাইব্রেরি (${images.length})</h2>
      <div class="note-box">শুধু আপনার নিজের ফোল্ডারের ছবি এখানে দেখা যায়। কোনো পণ্যে ব্যবহার হচ্ছে এমন ছবি মোছা যায় না।</div>
      <div class="imggrid">${images.map(i=>`<div><img src="${esc(i.url)}" alt=""><div>${esc(Math.round((i.bytes||0)/1024))} KB</div>
        <button class="btn red small" style="margin-top:4px" data-pid="${esc(i.public_id)}" onclick="delImage(this.dataset.pid)">🗑️ মুছুন</button></div>`).join('')||'<p style="color:#888">এখনো কোনো ছবি আপলোড করা হয়নি।</p>'}</div></div>`;
  }catch(e){ c.innerHTML='<div class="card"><h2>🖼️ ছবি</h2><div class="lock">'+esc(e.message)+'<br><small>ছবি আপলোড পণ্যের ফর্ম থেকে যথারীতি কাজ করে।</small></div></div>'; }
}
async function delImage(pid){
  if(!confirm('ছবিটি স্থায়ীভাবে মুছবেন?')) return;
  try{ await api('/seller/upload?public_id='+encodeURIComponent(pid),'DELETE'); showMsg('✅ ছবি মোছা হয়েছে','ok'); renderImages(); }
  catch(e){ showMsg('❌ '+e.message,'error'); }
}

if(TOKEN) boot();
</script>
</body>
</html>
