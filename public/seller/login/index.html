<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>সেলার লগইন — NextGenTechBD</title>
<link rel="icon" href="/assets/logo-icon.png" />
<style>
:root{--orange:#F85606;--orange-dark:#e04a04;--bg:#f4f4f4;--muted:#8a8a8a;--shadow:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:#222;font-size:15px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:30px 26px;max-width:380px;width:100%}
h1{font-size:20px;color:var(--orange-dark);margin-bottom:4px}
p.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
label{font-size:12.5px;color:#555;font-weight:600;display:block;margin-bottom:4px}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:8px;outline:none;margin-bottom:14px}
input:focus{border-color:var(--orange)}
button{font:inherit;width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{background:#fdeaea;color:#c22;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
a{color:var(--orange-dark);font-size:13px;text-decoration:none;display:block;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>🏪 সেলার লগইন</h1>
  <p class="sub">আপনার সেলার অ্যাকাউন্টে ঢুকতে ইউজারনেম ও পাসওয়ার্ড দিন</p>
  <div class="err" id="err"></div>
  <label for="u">ইউজারনেম / সেলার আইডি</label>
  <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" />
  <label for="p">পাসওয়ার্ড</label>
  <input id="p" type="password" autocomplete="current-password" />
  <button id="go">লগইন করুন</button>
  <a href="/">← দোকানে ফিরুন</a>
</div>
<script>
const $ = id => document.getElementById(id);
async function login(){
  $('err').style.display='none';
  const username = $('u').value.trim(), password = $('p').value;
  if(!username || !password){ show('ইউজারনেম ও পাসওয়ার্ড দিন'); return; }
  $('go').disabled = true;
  try{
    const r = await fetch('/api/seller/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'লগইন ব্যর্থ হয়েছে');
    location.replace('/seller/');
  }catch(e){ show(e.message); $('go').disabled = false; }
}
function show(m){ const b=$('err'); b.textContent=m; b.style.display='block'; }
$('go').addEventListener('click', login);
['u','p'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') login(); }));
// আগে থেকেই লগইন থাকলে সরাসরি ড্যাশবোর্ডে
fetch('/api/seller/me').then(r => { if(r.ok) location.replace('/seller/'); }).catch(()=>{});
</script>
</body>
</html>
