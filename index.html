<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>NextGenTechBD — অ্যাডমিন প্যানেল</title>
<link rel="icon" href="/assets/logo-icon.png" />
<style>
:root{--orange:#F85606;--orange-dark:#e04a04;--bg:#f4f4f4;--card:#fff;--text:#222;--muted:#8a8a8a;--border:#ececec;--radius:10px;--shadow:0 2px 10px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;padding:9px 10px;border:1px solid #ddd;border-radius:8px;width:100%;background:#fff}
label{font-size:12.5px;color:#555;font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.btn{background:var(--orange);color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13.5px}
.btn:hover{background:var(--orange-dark)}
.btn.gray{background:#eee;color:#333}
.btn.gray:hover{background:#ddd}
.btn.red{background:#d92646;color:#fff}
.btn.small{padding:6px 10px;font-size:12.5px}
.container{max-width:1100px;margin:0 auto;padding:16px}
.hidden{display:none !important}

/* ---- Login ---- */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:32px 28px;max-width:360px;width:100%}
.login-card h1{font-size:20px;margin-bottom:6px;color:var(--orange-dark)}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:18px}
.login-err{color:#d92646;font-size:13px;margin-top:8px;display:none}

/* ---- Shell ---- */
header.topbar{background:#fff;box-shadow:0 1px 0 var(--border);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;color:var(--orange-dark);font-size:16px}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:13px;color:#555}
.tab.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:14px;color:var(--orange-dark)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:11.5px;text-transform:uppercase}
.row-actions{display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.ok{background:#e8f8ef;color:#0a7a3d}
.msg.error{background:#fdeaea;color:#c22}
.emoji-input{width:64px !important;text-align:center}
.divider{border-top:1px solid var(--border);margin:14px 0}
.spinner{text-align:center;padding:30px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat-card .n{font-size:24px;font-weight:800;color:var(--orange-dark)}
.stat-card .l{font-size:12px;color:var(--muted);margin-top:2px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.bar-row .lbl{width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar-wrap{flex:1;background:#f0f0f0;border-radius:6px;height:16px;overflow:hidden}
.bar-row .bar-fill{background:var(--orange);height:100%;border-radius:6px}
.bar-row .val{width:50px;text-align:right;flex-shrink:0;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:#e8f8ef;color:#0a7a3d}
.badge.warn{background:#fff3d6;color:#a06b00}
.badge.danger{background:#fdeaea;color:#c22}
.note-box{background:#fff8e6;border:1px solid #ffe4a3;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7a5900;margin-bottom:14px}
.notify-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#d92646;color:#fff;font-size:11px;font-weight:800;margin-left:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.toast-order{position:fixed;top:16px;right:16px;background:#fff;border-left:4px solid var(--orange);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:10px;padding:14px 16px;max-width:320px;z-index:999;cursor:pointer;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-order b{color:var(--orange-dark)}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginWrap">
  <div class="login-card">
    <h1><img src="/assets/logo-icon.png" alt="" style="height:38px;vertical-align:middle;margin-right:6px"><img src="/assets/logo.png" alt="NextGenTechBD" style="height:28px;vertical-align:middle"></h1>
    <p>অ্যাডমিন প্যানেলে ঢুকতে আপনার অ্যাডমিন কী দিন</p>
    <div class="field">
      <label>অ্যাডমিন কী (Admin Key)</label>
      <input type="password" id="adminKeyInput" placeholder="আপনার সিক্রেট কী" />
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">লগইন করুন</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img src="/assets/logo-icon.png" alt="" style="height:24px;vertical-align:middle;margin-right:4px"><img src="/assets/logo.png" alt="NextGenTechBD" style="height:18px;vertical-align:middle;margin-right:6px">অ্যাডমিন</div>
      <button class="btn gray small" onclick="doLogout()">লগআউট</button>
    </div>
  </header>
  <div class="container">
    <div class="tabs">
      <div class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">📊 ড্যাশবোর্ড</div>
      <div class="tab" data-tab="orders" onclick="switchTab('orders')">📦 অর্ডারসমূহ<span id="orderNotifyBadge" class="notify-badge hidden">0</span></div>
      <div class="tab" data-tab="customers" onclick="switchTab('customers')">👥 কাস্টমার</div>
      <div class="tab" data-tab="products" onclick="switchTab('products')">🛍️ পণ্যসমূহ</div>
      <div class="tab" data-tab="categories" onclick="switchTab('categories')">🗂️ ক্যাটাগরি</div>
      <div class="tab" data-tab="coupons" onclick="switchTab('coupons')">🎟️ কুপন ও অফার</div>
      <div class="tab" data-tab="banners" onclick="switchTab('banners')">🖼️ ব্যানার/স্লাইডার</div>
      <div class="tab" data-tab="reviews" onclick="switchTab('reviews')">⭐ রিভিউ</div>
      <div class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ দোকানের সেটিংস</div>
      <div class="tab" data-tab="hometext" onclick="switchTab('hometext')">📝 হোমপেজ টেক্সট</div>
      <div class="tab" data-tab="security" onclick="switchTab('security')">🔐 সিকিউরিটি</div>
      <div class="tab" data-tab="backup" onclick="switchTab('backup')">💾 ব্যাকআপ</div>
    </div>
    <div id="msgBox"></div>
    <div id="tabContent"></div>
  </div>
</div>

<script>
const API = '/api';
let ADMIN_KEY = localStorage.getItem('ngtbd_admin_key') || '';
let CATS_CACHE = [];

/* ============ AUTH ============ */
async function doLogin(){
  const key = document.getElementById('adminKeyInput').value.trim();
  const errBox = document.getElementById('loginErr');
  errBox.style.display='none';
  if(!key){ errBox.textContent='অ্যাডমিন কী দিন'; errBox.style.display='block'; return; }
  try{
    const r = await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||'লগইন ব্যর্থ');
    ADMIN_KEY = key;
    localStorage.setItem('ngtbd_admin_key', key);
    showApp();
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display='block';
  }
}
function doLogout(){
  localStorage.removeItem('ngtbd_admin_key');
  ADMIN_KEY='';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginWrap').classList.remove('hidden');
  stopOrderNotifications();
}
function showApp(){
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  switchTab('dashboard');
  startOrderNotifications();
}

/* ============ API HELPERS ============ */
async function adminApi(path, method='GET', body){
  const r = await fetch(API+path,{
    method,
    headers:{'Content-Type':'application/json','X-Admin-Key':ADMIN_KEY},
    body: body!==undefined ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(()=>({}));
  if(r.status===401){ doLogout(); throw new Error('সেশন শেষ — আবার লগইন করুন'); }
  if(!r.ok) throw new Error(j.error || 'একটি সমস্যা হয়েছে');
  return j;
}
function showMsg(text, type){
  const box = document.getElementById('msgBox');
  box.innerHTML = '<div class="msg '+type+'">'+text+'</div>';
  setTimeout(()=>{ box.innerHTML=''; }, 4000);
}

/* ============ নতুন অর্ডার নোটিফিকেশন ============ */
const ORIGINAL_TITLE = document.title;
let NOTIFY_POLL_TIMER = null;
let LAST_SEEN_IDS = new Set();
let NOTIFY_FIRST_RUN = true;

function startOrderNotifications(){
  if(typeof Notification!=='undefined' && Notification.permission==='default'){
    // অ্যাডমিন প্রথমবার লগইন করলে ব্রাউজার নোটিফিকেশনের অনুমতি চাওয়া হয় (নিরবে ব্যর্থ হলেও সমস্যা নেই)
    Notification.requestPermission().catch(()=>{});
  }
  pollNewOrders();
  NOTIFY_POLL_TIMER = setInterval(pollNewOrders, 20000); // প্রতি ২০ সেকেন্ডে চেক করবে
}
function stopOrderNotifications(){
  if(NOTIFY_POLL_TIMER){ clearInterval(NOTIFY_POLL_TIMER); NOTIFY_POLL_TIMER=null; }
  document.title = ORIGINAL_TITLE;
}
async function pollNewOrders(){
  if(!ADMIN_KEY) return;
  try{
    const j = await adminApi('/admin/orders/unseen');
    const badge = document.getElementById('orderNotifyBadge');
    if(j.count>0){
      badge.textContent = j.count>99?'99+':j.count;
      badge.classList.remove('hidden');
      document.title = '('+j.count+') '+ORIGINAL_TITLE;
    }else{
      badge.classList.add('hidden');
      document.title = ORIGINAL_TITLE;
    }
    // নতুন অর্ডার শনাক্ত হলে সাউন্ড + টোস্ট + ব্রাউজার নোটিফিকেশন (প্রথমবার পোল করার সময় দেখানো হয় না, যাতে লগইন করা মাত্রই পুরনো নোটিফিকেশনে সাউন্ড না বাজে)
    const freshOnes = (j.orders||[]).filter(o=>!LAST_SEEN_IDS.has(o.id));
    if(!NOTIFY_FIRST_RUN && freshOnes.length){
      playNotifySound();
      freshOnes.slice(0,3).forEach(o=>showOrderToast(o));
      if(typeof Notification!=='undefined' && Notification.permission==='granted'){
        try{ new Notification('🛍️ নতুন অর্ডার এসেছে!', {body: freshOnes[0].name+' — ৳'+freshOnes[0].total+' ('+freshOnes[0].order_no+')'}); }catch(e){}
      }
    }
    (j.orders||[]).forEach(o=>LAST_SEEN_IDS.add(o.id));
    NOTIFY_FIRST_RUN = false;
  }catch(e){ /* পোলিং ব্যর্থ হলেও প্যানেল ব্যবহারে বাধা দেওয়া ঠিক না */ }
}
async function markOrdersSeen(){
  try{
    await adminApi('/admin/orders/unseen','POST',{});
    document.getElementById('orderNotifyBadge').classList.add('hidden');
    document.title = ORIGINAL_TITLE;
  }catch(e){}
}
function showOrderToast(o){
  const el = document.createElement('div');
  el.className = 'toast-order';
  el.innerHTML = '🛍️ <b>নতুন অর্ডার!</b><br>'+o.name+' — ৳'+o.total+'<br><small style="color:#888">'+o.order_no+'</small>';
  el.onclick = ()=>{ switchTab('orders'); el.remove(); };
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 8000);
}
function playNotifySound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880,1108].forEach((freq,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      o.connect(g); g.connect(ctx.destination);
      const start = ctx.currentTime + i*0.15;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start+0.28);
      o.start(start); o.stop(start+0.3);
    });
  }catch(e){}
}

/* ============ TABS ============ */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  const c = document.getElementById('tabContent');
  c.innerHTML = '<div class="spinner">লোড হচ্ছে…</div>';
  if(name==='products') renderProducts();
  else if(name==='categories') renderCategories();
  else if(name==='settings') renderSettings();
  else if(name==='hometext') renderHomeText();
  else if(name==='orders'){ renderOrders(); markOrdersSeen(); }
  else if(name==='dashboard') renderDashboard();
  else if(name==='customers') renderCustomers();
  else if(name==='coupons') renderCoupons();
  else if(name==='banners') renderBanners();
  else if(name==='reviews') renderReviews();
  else if(name==='security') renderSecurity();
  else if(name==='backup') renderBackup();
}

/* ============ PRODUCTS ============ */
async function renderProducts(){
  const c = document.getElementById('tabContent');
  try{
    const [{products}, {categories}] = await Promise.all([adminApi('/admin/products'), adminApi('/admin/categories')]);
    CATS_CACHE = categories;
    const catName = id => { const x=categories.find(x=>x.id===id); return x ? (x.e+' '+x.name) : id; };
    c.innerHTML = `
      <div class="card">
        <h2>➕ নতুন পণ্য যোগ করুন / সম্পাদনা</h2>
        <form id="prodForm" onsubmit="saveProduct(event)">
          <input type="hidden" id="p_id" />
          <div class="grid3">
            <div class="field"><label>নাম (বাংলা) *</label><input id="p_name" required /></div>
            <div class="field"><label>Name (English)</label><input id="p_name_en" /></div>
            <div class="field"><label>ক্যাটাগরি *</label>
              <select id="p_cat" required>${categories.map(x=>`<option value="${x.id}">${x.e||''} ${x.name}</option>`).join('')}</select>
            </div>
          </div>
          <div class="grid3">
            <div class="field"><label>বিক্রয় মূল্য (৳) *</label><input id="p_price" type="number" required /></div>
            <div class="field"><label>আগের মূল্য (৳)</label><input id="p_old" type="number" /></div>
            <div class="field"><label>ইমোজি আইকন</label><input id="p_e" class="emoji-input" placeholder="📱" /></div>
          </div>
          <div class="field">
            <label>পণ্যের ছবি (সর্বোচ্চ ৫MB — আপলোড করলে সাথে সাথেই লাইভ হয়ে যাবে)</label>
            <input type="file" id="p_img_file" accept="image/*" onchange="uploadProductImage(this)" />
            <input type="hidden" id="p_img" />
            <div id="p_img_status" style="font-size:12px;color:#888;margin-top:6px"></div>
            <img id="p_img_preview" style="display:none;max-width:110px;max-height:110px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid #eee" />
          </div>
          <div class="grid3">
            <div class="field"><label>রেটিং (০-৫)</label><input id="p_r" type="number" step="0.1" /></div>
            <div class="field"><label>রিভিউ সংখ্যা</label><input id="p_rv" type="number" /></div>
            <div class="field"><label>বিক্রি হয়েছে</label><input id="p_sold" type="number" /></div>
          </div>
          <div class="grid3">
            <div class="field"><label>ট্যাগ (হট/নতুন/ফ্রি ডেলিভারি)</label><input id="p_tag" /></div>
            <div class="field"><label>রং (কমা দিয়ে আলাদা)</label><input id="p_colors" placeholder="কালো, সাদা" /></div>
            <div class="field"><label>সাইজ (কমা দিয়ে আলাদা)</label><input id="p_sizes" placeholder="S, M, L, XL" /></div>
          </div>
          <div class="grid3">
            <div class="field"><label>SKU (পণ্য কোড)</label><input id="p_sku" placeholder="যেমন: HC-EQ34-BLK" /></div>
            <div class="field"><label>বর্তমান স্টক</label><input id="p_stock" type="number" placeholder="খালি রাখলে স্টক ট্র্যাক হবে না" /></div>
            <div class="field"><label>লো-স্টক অ্যালার্ট (এর নিচে নামলে সতর্ক করবে)</label><input id="p_low_stock" type="number" placeholder="৫" /></div>
          </div>
          <div class="field" style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="p_f" style="width:auto" /> <label style="margin:0">ফ্ল্যাশ সেলে দেখাবে?</label>
          </div>
          <div class="row-actions">
            <button type="submit" class="btn">💾 সংরক্ষণ করুন</button>
            <button type="button" class="btn gray" onclick="resetProductForm()">✖ ফর্ম খালি করুন</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>🛍️ সব পণ্য (${products.length})</h2>
        <div class="field" style="max-width:320px"><input id="prodSearchBox" placeholder="🔍 নাম/SKU দিয়ে খুঁজুন" oninput="filterProductRows(this.value)" /></div>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>নাম</th><th>SKU</th><th>ক্যাটাগরি</th><th>মূল্য</th><th>স্টক</th><th>ফ্ল্যাশ</th><th></th></tr></thead>
          <tbody id="prodTableBody">
            ${products.map(p=>`
              <tr data-search="${(p.name+' '+(p.sku||'')).toLowerCase()}">
                <td>${p.img?`<img src="${p.img}" style="width:30px;height:30px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px">`:''}${p.e||''} ${p.name}</td>
                <td><small>${p.sku||'—'}</small></td>
                <td>${catName(p.cat)}</td>
                <td>৳${p.price}${p.old?` <s style="color:#aaa">৳${p.old}</s>`:''}</td>
                <td>${stockBadge(p)}</td>
                <td>${p.f?'✅':'—'}</td>
                <td class="row-actions">
                  <button class="btn gray small" onclick='editProduct(${JSON.stringify(p)})'>✏️ এডিট</button>

function stockBadge(p){
  if(p.stock===null||p.stock===undefined) return '<span style="color:#bbb">—</span>';
  if(p.stock<=0) return '<span class="badge danger">স্টক শেষ</span>';
  if(p.stock<=(p.low_stock_at||5)) return `<span class="badge warn">মাত্র ${p.stock}টি</span>`;
  return `<span class="badge ok">${p.stock}টি</span>`;
}
function filterProductRows(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#prodTableBody tr').forEach(tr=>{
    tr.style.display = tr.dataset.search.includes(q) ? '' : 'none';
  });
}
let STOCK_PRODUCT_ID = null;
function openStockAdjust(id,name,current){
  STOCK_PRODUCT_ID = id;
  document.getElementById('stockProdName').textContent = name+' (বর্তমান: '+(current===null?'ট্র্যাক করা হচ্ছে না':current)+')';
  document.getElementById('stockChange').value='';
  document.getElementById('stockReason').value='';
  document.getElementById('stockAdjustCard').classList.remove('hidden');
  document.getElementById('stockAdjustCard').scrollIntoView({behavior:'smooth'});
}
async function submitStockAdjust(){
  const change = Number(document.getElementById('stockChange').value);
  const reason = document.getElementById('stockReason').value.trim();
  if(!change){ showMsg('❌ পরিমাণ দিন (শূন্য ছাড়া)','error'); return; }
  try{
    await adminApi('/admin/stock','POST',{product_id:STOCK_PRODUCT_ID, change, reason});
    showMsg('✅ স্টক আপডেট হয়েছে','ok');
    document.getElementById('stockAdjustCard').classList.add('hidden');
    renderProducts();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}
function resetProductForm(){
  ['p_id','p_name','p_name_en','p_price','p_old','p_e','p_r','p_rv','p_sold','p_tag','p_colors','p_sizes','p_img','p_sku','p_stock','p_low_stock'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  document.getElementById('p_f').checked=false;
  document.getElementById('p_img_file').value='';
  document.getElementById('p_img_status').textContent='';
  const prev=document.getElementById('p_img_preview'); prev.src=''; prev.style.display='none';
}
async function uploadProductImage(input){
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('p_img_status');
  const prev = document.getElementById('p_img_preview');
  prev.src = URL.createObjectURL(file); prev.style.display='block';
  statusEl.textContent = '⏳ আপলোড হচ্ছে…';
  try{
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(API+'/admin/upload', { method:'POST', headers:{'X-Admin-Key':ADMIN_KEY}, body:fd });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'আপলোড ব্যর্থ হয়েছে');
    document.getElementById('p_img').value = j.url;
    prev.src = j.url;
    statusEl.textContent = '✅ ছবি আপলোড হয়েছে';
  }catch(e){
    statusEl.textContent = '❌ '+e.message;
  }
}
function editProduct(p){
  document.getElementById('p_id').value=p.id;
  document.getElementById('p_name').value=p.name||'';
  document.getElementById('p_name_en').value=p.name_en||'';
  document.getElementById('p_cat').value=p.cat||'';
  document.getElementById('p_price').value=p.price||'';
  document.getElementById('p_old').value=p.old||'';
  document.getElementById('p_e').value=p.e||'';
  document.getElementById('p_r').value=p.r||'';
  document.getElementById('p_rv').value=p.rv||'';
  document.getElementById('p_sold').value=p.sold||'';
  document.getElementById('p_tag').value=p.tag||'';
  document.getElementById('p_colors').value=(p.colors||[]).join(', ');
  document.getElementById('p_sizes').value=(p.sizes||[]).join(', ');
  document.getElementById('p_f').checked=!!p.f;
  document.getElementById('p_img').value=p.img||'';
  document.getElementById('p_sku').value=p.sku||'';
  document.getElementById('p_stock').value=(p.stock===null||p.stock===undefined)?'':p.stock;
  document.getElementById('p_low_stock').value=p.low_stock_at||'';
  document.getElementById('p_img_file').value='';
  document.getElementById('p_img_status').textContent='';
  const prev=document.getElementById('p_img_preview');
  if(p.img){ prev.src=p.img; prev.style.display='block'; } else { prev.src=''; prev.style.display='none'; }
  window.scrollTo({top:0,behavior:'smooth'});
}
async function saveProduct(ev){
  ev.preventDefault();
  const val = id => document.getElementById(id).value.trim();
  const splitList = s => s.split(',').map(x=>x.trim()).filter(Boolean);
  const body = {
    id: val('p_id') || undefined,
    name: val('p_name'), name_en: val('p_name_en'), cat: val('p_cat'),
    price: Number(val('p_price')), old: val('p_old')?Number(val('p_old')):undefined,
    e: val('p_e'), img: val('p_img') || undefined,
    r: val('p_r')?Number(val('p_r')):undefined, rv: val('p_rv')?Number(val('p_rv')):undefined,
    sold: val('p_sold')?Number(val('p_sold')):undefined, tag: val('p_tag'),
    colors: splitList(val('p_colors')), sizes: splitList(val('p_sizes')),
    sku: val('p_sku'), stock: val('p_stock'), low_stock_at: val('p_low_stock'),
    f: document.getElementById('p_f').checked
  };
  try{
    await adminApi('/admin/products','POST',body);
    showMsg('✅ পণ্য সংরক্ষণ হয়েছে','ok');
    resetProductForm();
    renderProducts();
  }catch(e){ showMsg('❌ '+e.message,'error'); }
}

}

async function updateOrderField(id, field, value){
  try{

async function toggleOrderHistory(id){
  const row = document.getElementById('ordHist-'+id);
  const body = document.getElementById('ordHistBody-'+id);
  if(!row.classList.contains('hidden')){ row.classList.add('hidden'); return; }
  row.classList.remove('hidden');
  body.innerHTML = 'লোড হচ্ছে…';
  try{
    const {history} = await adminApi('/admin/orders/history?id='+id);
    body.innerHTML = history.length ? history.map(h=>`<div style="font-size:12.5px;padding:4px 0;border-bottom:1px solid #eee">${STATUS_L[h.status]||h.status} — <small style="color:#888">${(h.created_at||'').slice(0,16)}</small>${h.note?' — '+h.note:''}</div>`).join('') : '<span style="color:#888;font-size:12.5px">কোনো ইতিহাস নেই</span>';
  }catch(e){ body.innerHTML = '<span style="color:#c22;font-size:12.5px">'+e.message+'</span>'; }
}

function resetCouponForm(){
  ['cp_id','cp_code','cp_value','cp_limit','cp_start','cp_end'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('cp_type').value='percent';
  document.getElementById('cp_cat').value='';

  document.getElementById('cp_first').checked=false;
  document.getElementById('cp_ship').checked=false;
  document.getElementById('cp_active').checked=true;
}
function editCoupon(cp){
  document.getElementById('cp_id').value=cp.id;
  document.getElementById('cp_code').value=cp.code;
  document.getElementById('cp_type').value=cp.type;

async function uploadBannerImage(input){
  const file = input.files[0]; if(!file) return;
  const statusEl = document.getElementById('bn_img_status');
  const prev = document.getElementById('bn_img_preview');
  prev.src = URL.createObjectURL(file); prev.style.display='block';
  statusEl.textContent = '⏳ আপলোড হচ্ছে…';
  try{
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(API+'/admin/upload', { method:'POST', headers:{'X-Admin-Key':ADMIN_KEY}, body:fd });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'আপলোড ব্যর্থ হয়েছে');
    document.getElementById('bn_img').value = j.url;
    prev.src = j.url;
    statusEl.textContent = '✅ ছবি আপলোড হয়েছে';
  }catch(e){ statusEl.textContent = '❌ '+e.message; }
}

function toCSV(rows, headers){
  const esc = v => '"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"';
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>esc(r[h])).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, csv){
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
